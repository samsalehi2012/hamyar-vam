<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0F5E5A">
<title>همیار وام · ورود</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/site.css">
<style>
body{margin:0;background:#FBF7F0}
*{box-sizing:border-box}
button,input{font-family:inherit}
a{color:#0F5E5A}a:hover{color:#0B4744}
input::placeholder{color:#A39B90}
input:focus{outline:3px solid rgba(15,94,90,0.35);outline-offset:2px}
</style>
</head>
<body class="hv-mobile">
<div id="hv-app"></div>
<template id="hv-tpl">
<div class="hv-root" dir="rtl" style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #FBF7F0; color: #1F2328; font-family: 'Vazirmatn', Tahoma, sans-serif; font-size: 18px; line-height: 1.8; overflow: hidden">

  <header style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px 6px">
    <a href="Main.dc.html" aria-label="بازگشت" style="width: 48px; height: 48px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E8DDCB; display: flex; align-items: center; justify-content: center; color: #1F2328">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
    </a>
    <button type="button" style="height: 48px; padding: 0 16px; border-radius: 999px; border: none; background: #E2EEEB; color: #0B4744; display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      برایم بخوان
    </button>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 22px; padding: 18px 20px; min-height: 0">
    <div style="width: 84px; height: 100px; border-radius: 42px 42px 16px 16px; background: #0F5E5A; display: flex; align-items: center; justify-content: center; color: #F3D27E; align-self: flex-start; position: relative">
      <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 18.5h3"/></svg>
    </div>

    <sc-if value="{{isPhone}}" hint-placeholder-val="{{true}}">
      <section style="display: flex; flex-direction: column; gap: 18px">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <h1 style="margin: 0; font-size: 28px; line-height: 1.5; font-weight: 900">ورود به همیار وام</h1>
          <p style="margin: 0; color: #57534E">فقط شماره موبایل خودتان را بنویسید.</p>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <label for="hv-phone" style="font-size: 17px; font-weight: 700">شماره موبایل</label>
          <input id="hv-phone" type="tel" inputmode="numeric" dir="ltr" placeholder="۰۹۱۲ ۳۴۵ ۶۷۸۹" style="height: 66px; border-radius: 16px; border: 2px solid #D9CDB8; background: #FFFFFF; padding: 0 18px; font-size: 26px; font-weight: 700; letter-spacing: 2px; text-align: center; color: #1F2328">
          <span style="font-size: 15px; color: #57534E">با اعداد فارسی یا انگلیسی، فرقی نمی‌کند.</span>
        </div>
        <div style="border-radius: 18px; background: #E2EEEB; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start; color: #0B4744">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 4px"><path d="M4 5h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H9l-5 4V6a1 1 0 0 1 1-1z"/><path d="M8 10h8M8 13.5h5"/></svg>
          <p style="margin: 0; font-size: 16px; font-weight: 600; line-height: 1.75">یک کد ۵ رقمی برایتان پیامک می‌کنیم. این کد فقط برای ورود به همیار وام است.</p>
        </div>
      </section>
    </sc-if>

    <sc-if value="{{isCode}}" hint-placeholder-val="{{false}}">
      <section style="display: flex; flex-direction: column; gap: 18px">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <h1 style="margin: 0; font-size: 28px; line-height: 1.5; font-weight: 900">کد ورود را بنویسید</h1>
          <p style="margin: 0; color: #57534E">کد را به شماره <span dir="ltr" style="font-weight: 800; color: #1F2328">۰۹۱۲ ۳۴۵ ۶۷۸۹</span> فرستادیم.</p>
          <button type="button" onClick="{{goPhone}}" style="align-self: flex-start; min-height: 44px; border: none; background: none; padding: 0; color: #0F5E5A; font-size: 16px; font-weight: 700; cursor: pointer; text-decoration: underline; text-underline-offset: 6px">شماره را عوض کنم</button>
        </div>
        <div dir="ltr" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px">
          <input aria-label="رقم اول" inputmode="numeric" maxlength="1" placeholder="۴" style="height: 68px; border-radius: 16px; border: 2px solid #0F5E5A; background: #FFFFFF; text-align: center; font-size: 28px; font-weight: 800">
          <input aria-label="رقم دوم" inputmode="numeric" maxlength="1" placeholder="۸" style="height: 68px; border-radius: 16px; border: 2px solid #0F5E5A; background: #FFFFFF; text-align: center; font-size: 28px; font-weight: 800">
          <input aria-label="رقم سوم" inputmode="numeric" maxlength="1" placeholder="۲" style="height: 68px; border-radius: 16px; border: 2px solid #0F5E5A; background: #FFFFFF; text-align: center; font-size: 28px; font-weight: 800">
          <input aria-label="رقم چهارم" inputmode="numeric" maxlength="1" style="height: 68px; border-radius: 16px; border: 2px solid #D9CDB8; background: #FFFFFF; text-align: center; font-size: 28px; font-weight: 800">
          <input aria-label="رقم پنجم" inputmode="numeric" maxlength="1" style="height: 68px; border-radius: 16px; border: 2px solid #D9CDB8; background: #FFFFFF; text-align: center; font-size: 28px; font-weight: 800">
        </div>
        <div style="display: flex; align-items: center; gap: 8px; font-size: 16px; color: #57534E">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          ارسال دوباره کد تا <span style="font-weight: 800; color: #1F2328">۱:۴۵</span>
        </div>
        <div style="border-radius: 18px; background: #FCEFD9; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start; color: #92400E">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 4px"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          <p style="margin: 0; font-size: 16px; font-weight: 600; line-height: 1.75">این کد فقط برای ورود به همیار وام است. کد پیامکی بانک را هرگز به کسی ندهید، حتی به ما.</p>
        </div>
      </section>
    </sc-if>
  </main>

  <footer style="padding: 12px 20px 18px; border-top: 1px solid #EADFCF; background: #FBF7F0; display: flex; flex-direction: column; gap: 10px">
    <sc-if value="{{isPhone}}" hint-placeholder-val="{{true}}">
      <button type="button" onClick="{{goCode}}" style="width: 100%; height: 60px; border-radius: 16px; border: none; background: #0F5E5A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 19px; font-weight: 800; cursor: pointer; box-shadow: 0 8px 18px rgba(15,94,90,0.22)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/></svg>
        فرستادن کد
      </button>
    </sc-if>
    <sc-if value="{{isCode}}" hint-placeholder-val="{{false}}">
      <a href="Purpose.dc.html" style="width: 100%; height: 60px; border-radius: 16px; background: #0F5E5A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 19px; font-weight: 800; text-decoration: none; box-shadow: 0 8px 18px rgba(15,94,90,0.22)">
        ورود
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m11 6-6 6 6 6"/></svg>
      </a>
    </sc-if>
    <button type="button" style="width: 100%; height: 52px; border-radius: 14px; border: 1.5px solid #0F5E5A; background: #FFFFFF; color: #0F5E5A; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 17px; font-weight: 800; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>
      تماس با کارشناس
    </button>
  </footer>
</div>
</template>
<script src="assets/morphdom.min.js"></script>
<script src="assets/hv-runtime.js"></script>
<script>
class Component extends DCLogic {
  renderVals() {
    const step = (this.state && this.state.step) || 'phone';
    return {
      isPhone: step === 'phone',
      isCode: step === 'code',
      goCode: () => this.setState({ step: 'code' }),
      goPhone: () => this.setState({ step: 'phone' })
    };
  }
}
HV.mount(Component, {});
</script>
</body>
</html>

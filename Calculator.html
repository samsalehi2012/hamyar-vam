<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0F5E5A">
<title>همیار وام · ماشین‌حساب</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/site.css">
<style>
body{margin:0;background:#FBF7F0}
*{box-sizing:border-box}
button,input{font-family:inherit}
a{color:#0F5E5A}a:hover{color:#0B4744}
.hv-range{-webkit-appearance:none;appearance:none;width:100%;height:12px;border-radius:99px;background:#E6DCCB;outline:none}
.hv-range::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:34px;height:34px;border-radius:50%;background:#0F5E5A;border:5px solid #FFFFFF;box-shadow:0 2px 8px rgba(15,94,90,0.4);cursor:pointer}
.hv-range::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#0F5E5A;border:5px solid #FFFFFF;box-shadow:0 2px 8px rgba(15,94,90,0.4);cursor:pointer}
.hv-range:focus-visible{outline:3px solid rgba(15,94,90,0.35);outline-offset:6px}
</style>
</head>
<body class="hv-mobile">
<div id="hv-app"></div>
<template id="hv-tpl">
<div class="hv-root" dir="rtl" style="width: 390px; height: 1440px; display: flex; flex-direction: column; background: #FBF7F0; color: #1F2328; font-family: 'Vazirmatn', Tahoma, sans-serif; font-size: 18px; line-height: 1.8; overflow: hidden">

  <header style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px 6px">
    <a href="Result.dc.html" aria-label="بازگشت" style="width: 48px; height: 48px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E8DDCB; display: flex; align-items: center; justify-content: center; color: #1F2328">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
    </a>
    <button type="button" style="height: 48px; padding: 0 16px; border-radius: 999px; border: none; background: #E2EEEB; color: #0B4744; display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      برایم بخوان
    </button>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 12px 20px 16px; min-height: 0">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <div style="display: flex; align-items: center; gap: 8px">
        <span style="font-size: 15px; font-weight: 800; color: #0F5E5A">ماشین‌حساب وام عادی</span>
        <span style="font-size: 13px; font-weight: 800; color: #92400E; background: #FCEFD9; border-radius: 999px; padding: 0 10px">تخمینی</span>
      </div>
      <h1 style="margin: 0; font-size: 27px; line-height: 1.5; font-weight: 900">چقدر پول باید در حساب بماند؟</h1>
    </div>

    <section style="border-radius: 22px; background: #FFFFFF; border: 1px solid #EADFCF; padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <label for="hv-amt" style="font-size: 16px; font-weight: 700; color: #57534E">چقدر وام می‌خواهید؟</label>
      <span style="font-size: 32px; font-weight: 900; color: #0B4744; line-height: 1.3">{{amtLabel}}</span>
      <div style="display: flex; align-items: center; gap: 12px">
        <button type="button" onClick="{{dec}}" aria-label="کمتر" style="width: 48px; height: 48px; flex: none; border-radius: 14px; border: 1.5px solid #D9CDB8; background: #FBF7F0; color: #0B4744; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
        <input id="hv-amt" class="hv-range" type="range" min="10" max="500" step="10" value="{{amt}}" onChange="{{onAmt}}" dir="rtl" style="flex: 1">
        <button type="button" onClick="{{inc}}" aria-label="بیشتر" style="width: 48px; height: 48px; flex: none; border-radius: 14px; border: 1.5px solid #D9CDB8; background: #FBF7F0; color: #0B4744; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 13px; color: #57534E; font-weight: 600; padding: 0 60px">
        <span>۱۰ میلیون</span>
        <span>۵۰۰ میلیون</span>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 16px; font-weight: 700; color: #57534E">چند ساله قسط بدهید؟</span>
      <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{years}}" as="y" hint-placeholder-count="5">
          <button type="button" onClick="{{y.pick}}" aria-pressed="{{y.on}}" style="height: 60px; border-radius: 16px; border: 2px solid {{y.border}}; background: {{y.bg}}; color: {{y.color}}; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2; cursor: pointer">
            <span style="font-size: 20px; font-weight: 900">{{y.n}}</span>
            <span style="font-size: 13px; font-weight: 700">سال</span>
          </button>
        </sc-for>
      </div>
    </section>

    <section style="position: relative; overflow: hidden; border-radius: 24px; background: #0B4744; color: #FFFFFF; padding: 18px; display: flex; flex-direction: column; gap: 6px">
      <div aria-hidden="true" style="position: absolute; left: -24px; bottom: -50px; width: 120px; height: 160px; border-radius: 60px 60px 0 0; background: rgba(255,255,255,0.06)"></div>
      <span style="font-size: 16px; color: #CFE6E2; font-weight: 600">باید حدود</span>
      <span style="font-size: 34px; font-weight: 900; color: #F3D27E; line-height: 1.35">{{need}}</span>
      <span style="font-size: 16px; color: #E3F1EE; font-weight: 600">را دست‌کم ۳ ماه در حساب نگه دارید.</span>
    </section>

    <section style="border-radius: 22px; background: #FFFFFF; border: 1px solid #EADFCF; padding: 14px 16px; display: flex; align-items: center; gap: 12px">
      <span style="width: 46px; height: 52px; flex: none; border-radius: 23px 23px 10px 10px; background: #E2EEEB; color: #0F5E5A; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>
      <div style="display: flex; flex-direction: column; line-height: 1.5">
        <span style="font-size: 15px; color: #57534E; font-weight: 600">قسط ماهانه حدود</span>
        <span style="font-size: 22px; font-weight: 900">{{inst}}</span>
      </div>
      <span style="margin-right: auto; font-size: 13px; color: #57534E; font-weight: 600; text-align: left; line-height: 1.5">{{months}} قسط<br>کارمزد ۴٪</span>
    </section>

    <section style="border-radius: 22px; background: #F3EBDD; padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <span style="font-size: 16px; font-weight: 800; line-height: 1.7">قاعده‌ای که کمتر کسی می‌داند: هرچه قسط طولانی‌تر، پول بیشتری باید در حساب بماند.</span>
      <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; align-items: end; height: 150px">
        <sc-for list="{{bars}}" as="b" hint-placeholder-count="5">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
            <span style="font-size: 13px; font-weight: 800; color: {{b.ink}}">{{b.mult}}</span>
            <span style="width: 100%; height: {{b.h}}; border-radius: 10px 10px 4px 4px; background: {{b.bg}}"></span>
            <span style="font-size: 13px; font-weight: 700; color: {{b.ink}}">{{b.n}} سال</span>
          </div>
        </sc-for>
      </div>
      <span style="font-size: 14px; color: #57534E; line-height: 1.7">ستون‌ها: پولی که به ازای هر ۱۰۰ تومان وام باید در حساب باشد.</span>
    </section>

    <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: 15px; color: #3F3B36; line-height: 1.7">
      <li style="display: flex; gap: 8px; align-items: flex-start"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2E7D32" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 4px"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>پولتان در حساب مسدود نمی‌شود.</li>
      <li style="display: flex; gap: 8px; align-items: flex-start"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2E7D32" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 4px"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>به‌جای پول خودتان، می‌شود از امتیاز یکی از اعضای خانواده استفاده کرد.</li>
      <li style="display: flex; gap: 8px; align-items: flex-start"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#57534E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 4px"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>عددها تخمینی است؛ رقم دقیق را بانک در ام‌رسالت اعلام می‌کند.</li>
    </ul>
  </main>

  <footer style="padding: 12px 20px 18px; border-top: 1px solid #EADFCF; background: #FBF7F0; display: flex; flex-direction: column; gap: 10px">
    <a href="Checklist.dc.html" style="width: 100%; height: 60px; border-radius: 16px; background: #0F5E5A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 19px; font-weight: 800; text-decoration: none; box-shadow: 0 8px 18px rgba(15,94,90,0.22)">
      ادامه: فهرست مدارک من
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m11 6-6 6 6 6"/></svg>
    </a>
    <button type="button" style="width: 100%; height: 52px; border-radius: 14px; border: 1.5px solid #0F5E5A; background: #FFFFFF; color: #0F5E5A; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 17px; font-weight: 800; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>
      تماس با کارشناس
    </button>
  </footer>
</div>
</template>
<script src="assets/morphdom.min.js"></script>
<script src="assets/hv-runtime.js"></script>
<script>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const amt = typeof s.amt === 'number' ? s.amt : 150;
    const yrs = typeof s.yrs === 'number' ? s.yrs : 3;
    const ratios = [1, 0.8, 0.6, 0.4, 0.2];
    const fa = (x) => String(x).replace(/[0-9]/g, (d) => '۰۱۲۳۴۵۶۷۸۹'[d]).replace('.', '٫');
    const toman = (v) => {
      if (v >= 1e9) {
        const b = Math.round(v / 1e8) / 10;
        return fa(b) + ' میلیارد تومان';
      }
      const m = v / 1e6;
      const r = m >= 10 ? Math.round(m) : Math.round(m * 10) / 10;
      return fa(r) + ' میلیون تومان';
    };
    const P = amt * 1e6;
    const need = P / ratios[yrs - 1];
    const n = yrs * 12;
    const rate = 0.04 / 12;
    const inst = P * rate / (1 - Math.pow(1 + rate, -n));
    const clamp = (v) => Math.max(10, Math.min(500, v));
    const mults = ['۱', '۱٫۲۵', '۱٫۷', '۲٫۵', '۵'];
    const multVals = [1, 1.25, 1.667, 2.5, 5];
    return {
      amt: amt,
      amtLabel: toman(P),
      need: toman(need),
      inst: toman(inst),
      months: fa(n),
      onAmt: (e) => this.setState({ amt: Number(e.target.value) }),
      inc: () => this.setState({ amt: clamp(amt + 10) }),
      dec: () => this.setState({ amt: clamp(amt - 10) }),
      years: [1, 2, 3, 4, 5].map((y) => ({
        n: fa(y),
        on: y === yrs,
        border: y === yrs ? '#0F5E5A' : '#E2D8C6',
        bg: y === yrs ? '#0F5E5A' : '#FFFFFF',
        color: y === yrs ? '#FFFFFF' : '#1F2328',
        pick: () => this.setState({ yrs: y })
      })),
      bars: [1, 2, 3, 4, 5].map((y, i) => ({
        n: fa(y),
        mult: mults[i] + '×',
        h: Math.round(16 + (multVals[i] / 5) * 84) + 'px',
        bg: y === yrs ? '#0F5E5A' : '#D9CDB8',
        ink: y === yrs ? '#0B4744' : '#57534E'
      }))
    };
  }
}
HV.mount(Component, {});
</script>
</body>
</html>

<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0F5E5A">
<title>همیار وام · جلسه همراهی</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/site.css">
<style>
body{margin:0;background:#FBF7F0}
*{box-sizing:border-box}
button,input{font-family:inherit}
a{color:#0F5E5A}a:hover{color:#0B4744}
</style>
</head>
<body class="hv-mobile">
<div id="hv-app"></div>
<template id="hv-tpl">
<div class="hv-root" dir="rtl" style="width: 390px; height: 1500px; display: flex; flex-direction: column; background: #FBF7F0; color: #1F2328; font-family: 'Vazirmatn', Tahoma, sans-serif; font-size: 18px; line-height: 1.8; overflow: hidden">

  <header style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px 6px">
    <a href="Consent.dc.html" aria-label="بازگشت" style="width: 48px; height: 48px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E8DDCB; display: flex; align-items: center; justify-content: center; color: #1F2328">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
    </a>
    <button type="button" style="height: 48px; padding: 0 16px; border-radius: 999px; border: none; background: #E2EEEB; color: #0B4744; display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      برایم بخوان
    </button>
  </header>

  <div style="padding: 8px 20px 0; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: space-between; align-items: center; font-size: 15px; color: #57534E">
      <span style="font-weight: 800; color: #0B4744">مرحله ۵ از ۵ · همراهی</span>
      <span style="display: flex; align-items: center; gap: 6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2E7D32" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>ذخیره شد</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
      <span style="height: 8px; border-radius: 99px; background: #0F5E5A"></span>
      <span style="height: 8px; border-radius: 99px; background: #0F5E5A"></span>
      <span style="height: 8px; border-radius: 99px; background: #0F5E5A"></span>
      <span style="height: 8px; border-radius: 99px; background: #0F5E5A"></span>
      <span style="height: 8px; border-radius: 99px; background: #0F5E5A"></span>
    </div>
  </div>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 18px 20px 16px; min-height: 0">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-size: 27px; line-height: 1.5; font-weight: 900">رزرو جلسه همراهی</h1>
      <p style="margin: 0; font-size: 16px; line-height: 1.75; color: #57534E">این سه کار را فقط خودتان می‌توانید انجام دهید. کارشناس ما کنارتان است و قدم‌به‌قدم می‌گوید.</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; align-items: center; gap: 10px; border-radius: 16px; background: #FFFFFF; border: 1px solid #EADFCF; padding: 10px 12px">
        <span style="width: 38px; height: 38px; flex: none; border-radius: 12px; background: #E2EEEB; color: #0F5E5A; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3"/></svg></span>
        <span style="font-size: 16px; font-weight: 700; line-height: 1.6">ضبط ویدیو سلفی <span style="color: #57534E; font-weight: 500">(کمتر از ۱۵ ثانیه)</span></span>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; border-radius: 16px; background: #FFFFFF; border: 1px solid #EADFCF; padding: 10px 12px">
        <span style="width: 38px; height: 38px; flex: none; border-radius: 12px; background: #E2EEEB; color: #0F5E5A; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5h14a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H9l-5 4V6a1 1 0 0 1 1-1z"/><path d="M8 10h8M8 13.5h5"/></svg></span>
        <span style="font-size: 16px; font-weight: 700; line-height: 1.6">وارد کردن کد پیامکی <span style="color: #57534E; font-weight: 500">(روی گوشی خودتان)</span></span>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; border-radius: 16px; background: #FFFFFF; border: 1px solid #EADFCF; padding: 10px 12px">
        <span style="width: 38px; height: 38px; flex: none; border-radius: 12px; background: #E2EEEB; color: #0F5E5A; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg></span>
        <span style="font-size: 16px; font-weight: 700; line-height: 1.6">امضای تعهدنامه دیجیتال <span style="color: #57534E; font-weight: 500">(سفته الکترونیک)</span></span>
      </div>
    </div>

    <section style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 19px; font-weight: 900">کجا همراهی‌تان کنیم؟</h2>
      <sc-for list="{{modes}}" as="m" hint-placeholder-count="3">
        <button type="button" onClick="{{m.pick}}" aria-pressed="{{m.on}}" style="min-height: 76px; border-radius: 20px; border: 2.5px solid {{m.border}}; background: {{m.bg}}; display: flex; align-items: center; gap: 12px; padding: 10px 14px; text-align: right; color: #1F2328; cursor: pointer">
          <span style="width: 48px; height: 54px; flex: none; border-radius: 24px 24px 10px 10px; background: {{m.tile}}; color: {{m.tileInk}}; display: flex; align-items: center; justify-content: center">
            <sc-if value="{{m.isVideo}}" hint-placeholder-val="{{false}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3"/></svg></sc-if>
            <sc-if value="{{m.isOffice}}" hint-placeholder-val="{{false}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16"/><path d="M16 9h2a2 2 0 0 1 2 2v10"/><path d="M8 7h4M8 11h4M8 15h4"/><path d="M3 21h18"/></svg></sc-if>
            <sc-if value="{{m.isHome}}" hint-placeholder-val="{{false}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg></sc-if>
          </span>
          <span style="flex: 1; display: flex; flex-direction: column; line-height: 1.5">
            <span style="font-size: 17px; font-weight: 800">{{m.title}}</span>
            <span style="font-size: 14px; color: #57534E">{{m.sub}}</span>
          </span>
          <span style="width: 26px; height: 26px; flex: none; border-radius: 50%; border: 2.5px solid {{m.border}}; background: {{m.dot}}; box-shadow: inset 0 0 0 4px #FFFFFF"></span>
        </button>
      </sc-for>
    </section>

    <section style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 19px; font-weight: 900">کدام روز؟</h2>
      <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{days}}" as="d" hint-placeholder-count="5">
          <button type="button" onClick="{{d.pick}}" aria-pressed="{{d.on}}" style="height: 84px; border-radius: 18px; border: 2px solid {{d.border}}; background: {{d.bg}}; color: {{d.color}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; line-height: 1.3; cursor: pointer">
            <span style="font-size: 13px; font-weight: 700">{{d.wd}}</span>
            <span style="font-size: 24px; font-weight: 900">{{d.n}}</span>
            <span style="font-size: 12px; font-weight: 700">مهر</span>
          </button>
        </sc-for>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 19px; font-weight: 900">چه ساعتی؟</h2>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{times}}" as="t" hint-placeholder-count="6">
          <button type="button" onClick="{{t.pick}}" disabled="{{t.full}}" aria-pressed="{{t.on}}" style="height: 56px; border-radius: 14px; border: 2px solid {{t.border}}; background: {{t.bg}}; color: {{t.color}}; font-size: 18px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; text-decoration: {{t.deco}}">
            {{t.label}}<span style="font-size: 12px; font-weight: 700">{{t.note}}</span>
          </button>
        </sc-for>
      </div>
    </section>

    <section style="border-radius: 20px; background: #F3EBDD; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 16px; font-weight: 800">قبل از جلسه آماده کنید:</span>
      <div style="display: flex; flex-direction: column; gap: 6px; font-size: 15px; font-weight: 600; line-height: 1.7">
        <span style="display: flex; gap: 8px; align-items: flex-start"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0F5E5A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 5px"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>گوشی خودتان، با سیم‌کارتی که به نام خودتان است</span>
        <span style="display: flex; gap: 8px; align-items: flex-start"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0F5E5A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 5px"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>کارت ملی</span>
        <span style="display: flex; gap: 8px; align-items: flex-start"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0F5E5A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 5px"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>یک جای آرام و پرنور</span>
      </div>
    </section>
  </main>

  <footer style="padding: 12px 20px 18px; border-top: 1px solid #EADFCF; background: #FBF7F0; display: flex; flex-direction: column; gap: 10px">
    <a href="Tracking.dc.html" style="width: 100%; min-height: 64px; border-radius: 16px; background: #0F5E5A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 17px; font-weight: 800; text-decoration: none; box-shadow: 0 8px 18px rgba(15,94,90,0.22); padding: 6px 14px; text-align: center; line-height: 1.5">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      رزرو برای {{summary}}
    </a>
    <button type="button" style="width: 100%; height: 52px; border-radius: 14px; border: 1.5px solid #0F5E5A; background: #FFFFFF; color: #0F5E5A; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 17px; font-weight: 800; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>
      تماس با کارشناس
    </button>
  </footer>
</div>
</template>
<script src="assets/morphdom.min.js"></script>
<script src="assets/hv-runtime.js"></script>
<script>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const mode = s.mode || 'video';
    const day = s.day || '12';
    const time = s.time || '۱۰:۳۰';
    const modeList = [
      { id: 'video', title: 'تماس تصویری', sub: 'از خانه، با گوشی خودتان', tile: '#E2EEEB', ink: '#0F5E5A' },
      { id: 'office', title: 'آمدن به دفتر', sub: '[نشانی دفتر]', tile: '#F3EBDD', ink: '#6B4E1F' },
      { id: 'home', title: 'آمدن کارشناس به منزل', sub: 'برای کسی که نمی‌تواند بیاید', tile: '#FCEFD9', ink: '#92400E' }
    ];
    const dayList = [
      { id: '12', wd: 'یکشنبه', n: '۱۲' }, { id: '13', wd: 'دوشنبه', n: '۱۳' }, { id: '14', wd: 'سه‌شنبه', n: '۱۴' },
      { id: '15', wd: 'چهارشنبه', n: '۱۵' }, { id: '18', wd: 'شنبه', n: '۱۸' }
    ];
    const timeList = [
      { l: '۹:۰۰', full: false }, { l: '۱۰:۳۰', full: false }, { l: '۱۲:۰۰', full: true },
      { l: '۱۶:۰۰', full: false }, { l: '۱۷:۳۰', full: false }, { l: '۱۹:۰۰', full: true }
    ];
    const dSel = dayList.find((d) => d.id === day) || dayList[0];
    const mSel = modeList.find((m) => m.id === mode) || modeList[0];
    return {
      summary: dSel.wd + ' ' + dSel.n + ' مهر، ساعت ' + time + ' · ' + mSel.title,
      modes: modeList.map((m) => ({
        title: m.title, sub: m.sub, tile: m.tile, tileInk: m.ink,
        isVideo: m.id === 'video', isOffice: m.id === 'office', isHome: m.id === 'home',
        on: m.id === mode,
        border: m.id === mode ? '#0F5E5A' : '#E2D8C6',
        bg: m.id === mode ? '#F4FAF8' : '#FFFFFF',
        dot: m.id === mode ? '#0F5E5A' : '#FFFFFF',
        pick: () => this.setState({ mode: m.id })
      })),
      days: dayList.map((d) => ({
        wd: d.wd, n: d.n, on: d.id === day,
        border: d.id === day ? '#0F5E5A' : '#E2D8C6',
        bg: d.id === day ? '#0F5E5A' : '#FFFFFF',
        color: d.id === day ? '#FFFFFF' : '#1F2328',
        pick: () => this.setState({ day: d.id })
      })),
      times: timeList.map((t) => ({
        label: t.l, full: t.full, on: t.l === time,
        note: t.full ? 'پر' : '',
        deco: t.full ? 'line-through' : 'none',
        border: t.full ? '#EFE8DC' : (t.l === time ? '#0F5E5A' : '#E2D8C6'),
        bg: t.full ? '#F4EFE7' : (t.l === time ? '#0F5E5A' : '#FFFFFF'),
        color: t.full ? '#8A8279' : (t.l === time ? '#FFFFFF' : '#1F2328'),
        pick: () => { if (!t.full) this.setState({ time: t.l }); }
      }))
    };
  }
}
HV.mount(Component, {});
</script>
</body>
</html>

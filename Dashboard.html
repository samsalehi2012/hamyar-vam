<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0F5E5A">
<title>همیار وام · پنل کارشناس · داشبورد</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/site.css">
<style>
body{margin:0;background:#F6F1E8}
*{box-sizing:border-box}
button,input{font-family:inherit}
a{color:#0F5E5A}a:hover{color:#0B4744}
input::placeholder{color:#8A8279}
.hv-card{transition:transform .15s ease, box-shadow .15s ease}
.hv-card:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(60,40,10,0.10)}
</style>
</head>
<body class="hv-desktop">
<div id="hv-app"></div>
<template id="hv-tpl">
<div class="hv-root" dir="rtl" style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #F6F1E8; color: #1F2328; font-family: 'Vazirmatn', Tahoma, sans-serif; font-size: 15px; line-height: 1.7">

  <aside style="flex: 1 1 232px; max-width: 100%; background: #0B4744; color: #FFFFFF; padding: 22px 16px; display: flex; flex-direction: column; gap: 22px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 6px">
      <svg width="36" height="36" viewBox="0 0 40 40" aria-hidden="true"><path d="M5 38V19a15 15 0 0 1 30 0v19z" fill="#FBF7F0"/><circle cx="20" cy="17.5" r="5.2" fill="#E9B949"/><path d="M11 27.5c2.8 2.6 5.8 3.8 9 3.8s6.2-1.2 9-3.8" stroke="#0B4744" stroke-width="2.8" fill="none" stroke-linecap="round"/></svg>
      <div style="display: flex; flex-direction: column; line-height: 1.35">
        <span style="font-size: 19px; font-weight: 900">همیار وام</span>
        <span style="font-size: 12px; color: #9FD3CB; font-weight: 600">پنل کارشناس</span>
      </div>
    </div>
    <nav aria-label="منوی پنل" style="display: flex; flex-direction: column; gap: 4px">
      <a href="Dashboard.dc.html" aria-current="page" style="height: 46px; border-radius: 12px; background: rgba(255,255,255,0.12); color: #FFFFFF; display: flex; align-items: center; gap: 10px; padding: 0 12px; font-weight: 800; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>داشبورد</a>
      <a href="CaseDetail.dc.html" style="height: 46px; border-radius: 12px; color: #CFE6E2; display: flex; align-items: center; gap: 10px; padding: 0 12px; font-weight: 700; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>پرونده‌ها</a>
      <a href="Calendar.dc.html" style="height: 46px; border-radius: 12px; color: #CFE6E2; display: flex; align-items: center; gap: 10px; padding: 0 12px; font-weight: 700; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>تقویم جلسات</a>
      <a href="Rules.dc.html" style="height: 46px; border-radius: 12px; color: #CFE6E2; display: flex; align-items: center; gap: 10px; padding: 0 12px; font-weight: 700; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>قواعد وام</a>
    </nav>
    <div style="margin-top: auto; display: flex; align-items: center; gap: 10px; border-radius: 14px; background: rgba(255,255,255,0.08); padding: 10px">
      <span style="width: 40px; height: 40px; border-radius: 50%; background: #E9DCC5; color: #6B4E1F; font-weight: 900; display: flex; align-items: center; justify-content: center">س</span>
      <span style="display: flex; flex-direction: column; line-height: 1.4"><span style="font-weight: 800">سارا رحیمی</span><span style="font-size: 12px; color: #9FD3CB">کارشناس پرونده</span></span>
    </div>
  </aside>

  <main style="flex: 999 1 560px; min-width: 0; padding: 26px 28px 32px; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 14px; justify-content: space-between">
      <div style="display: flex; flex-direction: column; line-height: 1.5">
        <span style="font-size: 14px; color: #57534E; font-weight: 600">شنبه ۱۱ مهر ۱۴۰۵</span>
        <h1 style="margin: 0; font-size: 28px; font-weight: 900">سلام سارا، امروز ۴ پرونده منتظر شماست</h1>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center">
        <label style="height: 46px; min-width: 280px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E6DCCB; display: flex; align-items: center; gap: 8px; padding: 0 12px; color: #57534E">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" aria-label="جستجو" placeholder="جستجوی نام، کد ملی یا موبایل" style="flex: 1; border: none; outline: none; background: transparent; font-size: 15px; color: #1F2328">
        </label>
        <button type="button" style="height: 46px; border-radius: 12px; border: none; background: #0F5E5A; color: #FFFFFF; display: flex; align-items: center; gap: 8px; padding: 0 16px; font-size: 15px; font-weight: 800; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>پرونده جدید</button>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 14px">
      <div style="border-radius: 18px; background: #0F5E5A; color: #FFFFFF; padding: 16px 18px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 14px; color: #CFE6E2; font-weight: 700">منتظر شما (نوبت ما)</span>
        <span style="font-size: 34px; font-weight: 900; line-height: 1.3">۴</span>
      </div>
      <div style="border-radius: 18px; background: #FFFFFF; border: 1px solid #E6DCCB; padding: 16px 18px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 14px; color: #57534E; font-weight: 700">نوبت متقاضی</span>
        <span style="font-size: 34px; font-weight: 900; line-height: 1.3">۵</span>
      </div>
      <div style="border-radius: 18px; background: #FFFFFF; border: 1px solid #E6DCCB; padding: 16px 18px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 14px; color: #57534E; font-weight: 700">جلسه‌های همراهی امروز</span>
        <span style="font-size: 34px; font-weight: 900; line-height: 1.3">۳</span>
      </div>
      <div style="border-radius: 18px; background: #FFFFFF; border: 1px solid #E6DCCB; padding: 16px 18px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 14px; color: #57534E; font-weight: 700">واریز شده در مهر</span>
        <span style="font-size: 34px; font-weight: 900; line-height: 1.3">۱</span>
      </div>
    </div>

    <section aria-label="هشدارها" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); gap: 12px">
      <div style="border-radius: 16px; background: #FCEFD9; border: 1px solid #EBC889; padding: 12px 14px; display: flex; align-items: center; gap: 12px; color: #7A3A0B">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span style="flex: 1; font-weight: 700">اعتبارسنجی مرآت <strong>محمد نوری</strong> ۱۲ روز دیگر منقضی می‌شود (اعتبار ۱۰ ماهه).</span>
        <a href="CaseDetail.dc.html" style="font-weight: 800; color: #7A3A0B; min-height: 40px; display: flex; align-items: center">پیگیری</a>
      </div>
      <div style="border-radius: 16px; background: #FCEFD9; border: 1px solid #EBC889; padding: 12px 14px; display: flex; align-items: center; gap: 12px; color: #7A3A0B">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <span style="flex: 1; font-weight: 700">مهلت ۶۰ روز کاری وام ازدواج <strong>علی و مریم</strong>: ۲۳ روز کاری مانده.</span>
        <a href="CaseDetail.dc.html" style="font-weight: 800; color: #7A3A0B; min-height: 40px; display: flex; align-items: center">باز کردن</a>
      </div>
    </section>

    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
        <button type="button" onClick="{{f.pick}}" aria-pressed="{{f.on}}" style="height: 40px; border-radius: 999px; border: 1.5px solid {{f.border}}; background: {{f.bg}}; color: {{f.color}}; padding: 0 14px; font-size: 14px; font-weight: 800; cursor: pointer">{{f.label}}</button>
      </sc-for>
    </div>

    <div style="overflow-x: auto; padding-bottom: 6px">
      <div style="display: grid; grid-template-columns: repeat(6, minmax(176px, 1fr)); gap: 12px; min-width: 1130px">
        <sc-for list="{{cols}}" as="c" hint-placeholder-count="6">
          <section style="border-radius: 18px; background: #EFE8DC; padding: 10px; display: flex; flex-direction: column; gap: 10px; min-height: 520px">
            <div style="display: flex; align-items: center; justify-content: space-between; padding: 4px 6px">
              <span style="display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 15px"><span style="width: 24px; height: 24px; border-radius: 8px; background: #0F5E5A; color: #FFFFFF; font-size: 13px; display: flex; align-items: center; justify-content: center">{{c.n}}</span>{{c.title}}</span>
              <span style="font-size: 13px; font-weight: 800; color: #57534E; background: #FFFFFF; border-radius: 999px; padding: 0 10px">{{c.count}}</span>
            </div>
            <sc-for list="{{c.cards}}" as="k" hint-placeholder-count="2">
              <a href="CaseDetail.dc.html" class="hv-card" style="border-radius: 14px; background: #FFFFFF; border: {{k.ring}}; padding: 12px; display: flex; flex-direction: column; gap: 6px; color: #1F2328; text-decoration: none">
                <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
                  <span style="font-size: 15px; font-weight: 900">{{k.name}}</span>
                  <span style="width: 26px; height: 26px; border-radius: 50%; background: {{k.avBg}}; color: {{k.avInk}}; font-size: 12px; font-weight: 900; display: flex; align-items: center; justify-content: center">{{k.av}}</span>
                </div>
                <span style="font-size: 13px; color: #57534E; font-weight: 600">{{k.loan}}</span>
                <span style="font-size: 14px; font-weight: 700; line-height: 1.6">{{k.status}}</span>
                <sc-if value="{{k.hasAlert}}" hint-placeholder-val="{{false}}">
                  <span style="display: flex; gap: 6px; align-items: flex-start; font-size: 12px; font-weight: 800; color: #92400E; background: #FCEFD9; border-radius: 8px; padding: 4px 8px; line-height: 1.6"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 3px"><path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/></svg>{{k.alert}}</span>
                </sc-if>
                <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 2px">
                  <span style="font-size: 12px; font-weight: 800; background: {{k.tagBg}}; color: {{k.tagInk}}; border-radius: 999px; padding: 1px 10px">{{k.tag}}</span>
                  <span style="font-size: 12px; color: #57534E; font-weight: 600">{{k.age}}</span>
                </div>
              </a>
            </sc-for>
          </section>
        </sc-for>
      </div>
    </div>
  </main>
</div>
</template>
<script src="assets/morphdom.min.js"></script>
<script src="assets/hv-runtime.js"></script>
<script>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const filter = s.filter || 'all';
    const T = {
      us: { tag: 'نوبت ما', tagBg: '#E2EEEB', tagInk: '#0B4744' },
      them: { tag: 'نوبت متقاضی', tagBg: '#FCEFD9', tagInk: '#92400E' },
      bank: { tag: 'منتظر بانک', tagBg: '#ECE8F6', tagInk: '#4B3A8C' },
      done: { tag: 'انجام شد', tagBg: '#E5F2E5', tagInk: '#1B5E20' }
    };
    const raw = [
      { n: '۱', title: 'مدارک', cards: [
        { name: 'رضا کریمی', loan: 'وام عادی · ۱۵۰ میلیون · ۳ ساله', status: 'منتظر عکس شناسنامه', t: 'them', age: '۲ روز', av: 'س', hot: true },
        { name: 'زهرا موسوی', loan: 'فرزندآوری · ۸۸ میلیون', status: '۳ مدرک تازه برای بررسی', t: 'us', age: 'امروز', av: 'س' },
        { name: 'کاظم شریفی', loan: 'وام عادی · ۸۰ میلیون', status: 'فیش حقوقی تار بود؛ درخواست عکس دوباره', t: 'them', age: '۴ روز', av: 'م' }
      ] },
      { n: '۲', title: 'حساب رسالت', cards: [
        { name: 'علی و مریم', loan: 'ازدواج · ۳۰۰ میلیون برای هر نفر', status: 'منتظر جلسه ویدیو سلفی (دوشنبه)', t: 'them', age: '۵ روز', av: 'س', alert: '۲۳ روز کاری تا پایان مهلت ۶۰ روزه' },
        { name: 'حسن جعفری', loan: 'وام عادی · ۱۰۰ میلیون', status: 'افتتاح حساب غیرحضوری', t: 'us', age: '۱ روز', av: 'م' }
      ] },
      { n: '۳', title: 'بررسی خوش‌حسابی', cards: [
        { name: 'فاطمه احمدی', loan: 'کسب‌وکار · ۲۰۰ میلیون', status: 'آماده‌سازی فرم مرآت (خیاط با جواز کسب)', t: 'us', age: '۳ روز', av: 'س' },
        { name: 'منیژه کاظمی', loan: 'وام عادی · ۵۰ میلیون', status: 'منتظر پیامک نتیجه (روز ۶)', t: 'bank', age: '۶ روز', av: 'م' }
      ] },
      { n: '۴', title: 'ضامن و تعهدنامه', cards: [
        { name: 'مهری صادقی', loan: 'وام عادی · ۱۲۰ میلیون', status: 'ضامن مدارکش را فرستاد', t: 'us', age: 'امروز', av: 'س' }
      ] },
      { n: '۵', title: 'ثبت درخواست وام', cards: [
        { name: 'محمد نوری', loan: 'وام عادی · ۳۰۰ میلیون · ۵ ساله', status: 'منتظر رسیدن معدل حساب', t: 'them', age: '۱۸ روز', av: 'م', alert: 'اعتبار مرآت ۱۲ روز دیگر تمام می‌شود' },
        { name: 'عباس رضایی', loan: 'امداد ولایت · ۴۰۰ میلیون', status: 'تأیید درخواست در ام‌رسالت (جلسه سه‌شنبه)', t: 'them', age: '۲ روز', av: 'س' }
      ] },
      { n: '۶', title: 'واریز', cards: [
        { name: 'پروین قاسمی', loan: 'وام عادی · ۶۰ میلیون', status: 'واریز شد · ۹ مهر', t: 'done', age: 'بسته شد', av: 'م' }
      ] }
    ];
    const keep = (k) => filter === 'all' || (filter === 'us' && k.t === 'us') || (filter === 'them' && k.t === 'them') || (filter === 'alert' && !!k.alert);
    const fa = (n) => String(n).replace(/[0-9]/g, (d) => '۰۱۲۳۴۵۶۷۸۹'[d]);
    const cols = raw.map((c) => {
      const cards = c.cards.filter(keep).map((k) => Object.assign({}, k, T[k.t], {
        hasAlert: !!k.alert,
        ring: k.hot ? '2px solid #0F5E5A' : '1px solid #E6DCCB',
        avBg: k.av === 'س' ? '#E9DCC5' : '#DCE9E6',
        avInk: k.av === 'س' ? '#6B4E1F' : '#0B4744'
      }));
      return { n: c.n, title: c.title, cards: cards, count: fa(cards.length) };
    });
    const fl = [['all', 'همه (۱۱)'], ['us', 'منتظر من (۴)'], ['them', 'نوبت متقاضی (۵)'], ['alert', 'هشداردار (۲)']];
    return {
      cols: cols,
      filters: fl.map(([id, label]) => ({
        label, on: id === filter,
        border: id === filter ? '#0F5E5A' : '#E6DCCB',
        bg: id === filter ? '#0F5E5A' : '#FFFFFF',
        color: id === filter ? '#FFFFFF' : '#1F2328',
        pick: () => this.setState({ filter: id })
      }))
    };
  }
}
HV.mount(Component, {});
</script>
</body>
</html>

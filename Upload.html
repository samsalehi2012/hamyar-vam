<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0F5E5A">
<title>همیار وام · فرستادن مدرک</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/site.css">
<style>
body{margin:0;background:#FBF7F0}
*{box-sizing:border-box}
button,input{font-family:inherit}
a{color:#0F5E5A}a:hover{color:#0B4744}
@keyframes hvScan{0%{top:12%}50%{top:84%}100%{top:12%}}
.hv-scan{animation:hvScan 3.2s ease-in-out infinite}
</style>
</head>
<body class="hv-mobile">
<div id="hv-app"></div>
<template id="hv-tpl">
<div class="hv-root" dir="rtl" style="width: 390px; height: 900px; display: flex; flex-direction: column; background: #FBF7F0; color: #1F2328; font-family: 'Vazirmatn', Tahoma, sans-serif; font-size: 18px; line-height: 1.8; overflow: hidden">

  <header style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px 6px">
    <a href="Checklist.dc.html" aria-label="بازگشت" style="width: 48px; height: 48px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E8DDCB; display: flex; align-items: center; justify-content: center; color: #1F2328">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
    </a>
    <button type="button" style="height: 48px; padding: 0 16px; border-radius: 999px; border: none; background: #E2EEEB; color: #0B4744; display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      برایم بخوان
    </button>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 12px 20px 16px; min-height: 0">

    <sc-if value="{{isCamera}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <h1 style="margin: 0; font-size: 25px; line-height: 1.5; font-weight: 900">عکس صفحه اول شناسنامه</h1>
          <p style="margin: 0; font-size: 16px; line-height: 1.75; color: #57534E">شناسنامه را روی میز صاف بگذارید و همه گوشه‌ها را داخل کادر بیاورید.</p>
        </div>

        <div style="position: relative; height: 330px; border-radius: 26px; background: #1B2423; overflow: hidden; display: flex; align-items: center; justify-content: center">
          <div aria-hidden="true" style="position: absolute; inset: 0; background: radial-gradient(circle at 50% 45%, rgba(255,255,255,0.08), rgba(0,0,0,0) 60%)"></div>
          <span style="position: absolute; top: 14px; right: 0; left: 0; text-align: center; color: #FFFFFF; font-size: 15px; font-weight: 700">شناسنامه را داخل کادر بگذارید</span>
          <div aria-hidden="true" style="position: relative; width: 180px; height: 238px; transform: rotate(-4deg); border-radius: 8px; background: #EFE6D2; box-shadow: 0 14px 30px rgba(0,0,0,0.45); padding: 16px 14px; display: flex; flex-direction: column; gap: 9px; opacity: 0.92">
            <div style="display: flex; justify-content: space-between; align-items: flex-start">
              <span style="width: 22px; height: 22px; border-radius: 50%; border: 2px solid #B9A98A"></span>
              <span style="width: 42px; height: 52px; border-radius: 4px; background: #CFC2A6"></span>
            </div>
            <span style="height: 6px; width: 80%; border-radius: 9px; background: #C9BB9C"></span>
            <span style="height: 6px; width: 60%; border-radius: 9px; background: #C9BB9C"></span>
            <span style="height: 6px; width: 90%; border-radius: 9px; background: #C9BB9C"></span>
            <span style="height: 6px; width: 70%; border-radius: 9px; background: #C9BB9C"></span>
            <span style="height: 6px; width: 85%; border-radius: 9px; background: #C9BB9C"></span>
            <span style="height: 6px; width: 50%; border-radius: 9px; background: #C9BB9C"></span>
          </div>
          <div aria-hidden="true" style="position: absolute; width: 214px; height: 266px; top: 46px; border-radius: 14px">
            <span style="position: absolute; top: 0; right: 0; width: 34px; height: 34px; border-top: 4px solid #F4B93A; border-right: 4px solid #F4B93A; border-radius: 0 14px 0 0"></span>
            <span style="position: absolute; top: 0; left: 0; width: 34px; height: 34px; border-top: 4px solid #F4B93A; border-left: 4px solid #F4B93A; border-radius: 14px 0 0 0"></span>
            <span style="position: absolute; bottom: 0; right: 0; width: 34px; height: 34px; border-bottom: 4px solid #F4B93A; border-right: 4px solid #F4B93A; border-radius: 0 0 14px 0"></span>
            <span style="position: absolute; bottom: 0; left: 0; width: 34px; height: 34px; border-bottom: 4px solid #F4B93A; border-left: 4px solid #F4B93A; border-radius: 0 0 0 14px"></span>
            <span class="hv-scan" style="position: absolute; right: 10px; left: 10px; height: 2px; background: rgba(244,185,58,0.7); box-shadow: 0 0 12px rgba(244,185,58,0.8)"></span>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
          <div style="border-radius: 14px; background: #FFFFFF; border: 1px solid #EADFCF; padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B45309" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <span style="font-size: 14px; font-weight: 700; line-height: 1.5">نور روز</span>
          </div>
          <div style="border-radius: 14px; background: #FFFFFF; border: 1px solid #EADFCF; padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0F5E5A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 18.5h3"/></svg>
            <span style="font-size: 14px; font-weight: 700; line-height: 1.5">گوشی ثابت</span>
          </div>
          <div style="border-radius: 14px; background: #FFFFFF; border: 1px solid #EADFCF; padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0F5E5A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/></svg>
            <span style="font-size: 14px; font-weight: 700; line-height: 1.5">همه گوشه‌ها</span>
          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 10px">
          <button type="button" onClick="{{shoot}}" style="height: 66px; border-radius: 18px; border: none; background: #0F5E5A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 21px; font-weight: 900; cursor: pointer; box-shadow: 0 10px 22px rgba(15,94,90,0.25)">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8a2 2 0 0 1 2-2h2.5L9 4h6l1.5 2H19a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/></svg>
            عکس بگیر
          </button>
          <button type="button" onClick="{{shoot}}" style="height: 56px; border-radius: 16px; border: 1.5px solid #D9CDB8; background: #FFFFFF; color: #1F2328; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 18px; font-weight: 800; cursor: pointer">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>
            از گالری
          </button>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{isPreview}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <h1 style="margin: 0; font-size: 27px; line-height: 1.5; font-weight: 900">واضح است؟</h1>
          <p style="margin: 0; font-size: 16px; line-height: 1.75; color: #57534E">نوشته‌ها را راحت می‌توانید بخوانید؟</p>
        </div>

        <div style="height: 330px; border-radius: 26px; background: #EFE9DE; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden">
          <div aria-hidden="true" style="width: 196px; height: 260px; border-radius: 8px; background: #F6EEDC; box-shadow: 0 16px 34px rgba(60,40,10,0.22); padding: 18px 16px; display: flex; flex-direction: column; gap: 10px; filter: {{docFilter}}">
            <div style="display: flex; justify-content: space-between; align-items: flex-start">
              <span style="width: 24px; height: 24px; border-radius: 50%; border: 2px solid #B9A98A"></span>
              <span style="width: 46px; height: 58px; border-radius: 4px; background: #CFC2A6"></span>
            </div>
            <span style="height: 7px; width: 80%; border-radius: 9px; background: #BFAF8E"></span>
            <span style="height: 7px; width: 60%; border-radius: 9px; background: #BFAF8E"></span>
            <span style="height: 7px; width: 90%; border-radius: 9px; background: #BFAF8E"></span>
            <span style="height: 7px; width: 70%; border-radius: 9px; background: #BFAF8E"></span>
            <span style="height: 7px; width: 85%; border-radius: 9px; background: #BFAF8E"></span>
            <span style="height: 7px; width: 50%; border-radius: 9px; background: #BFAF8E"></span>
          </div>
          <span style="position: absolute; bottom: 12px; right: 12px; font-size: 13px; font-weight: 700; background: rgba(255,255,255,0.85); border-radius: 999px; padding: 0 10px; color: #3F3B36">۳۸۰ کیلوبایت · خودکار کوچک شد</span>
        </div>

        <sc-if value="{{blurry}}" hint-placeholder-val="{{false}}">
          <div style="border-radius: 18px; background: #FCEFD9; color: #7A3A0B; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 4px"><path d="M20 11a8 8 0 0 0-14.5-4.5L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.5 4.5L20 16"/><path d="M20 20v-4h-4"/></svg>
            <p style="margin: 0; font-size: 16px; font-weight: 600; line-height: 1.75">عکس کمی تار شده. اشکالی ندارد! گوشی را ثابت نگه دارید و یک‌بار دیگر بگیرید.</p>
          </div>
        </sc-if>
        <sc-if value="{{sharp}}" hint-placeholder-val="{{true}}">
          <div style="border-radius: 18px; background: #E5F2E5; color: #1B5E20; padding: 12px 16px; display: flex; gap: 12px; align-items: center">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="9"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>
            <p style="margin: 0; font-size: 16px; font-weight: 700; line-height: 1.7">عکس روشن و کامل به نظر می‌رسد.</p>
          </div>
        </sc-if>

        <div style="display: flex; flex-direction: column; gap: 10px">
          <sc-if value="{{sharp}}" hint-placeholder-val="{{true}}">
            <a href="Checklist.dc.html" style="height: 64px; border-radius: 18px; background: #0F5E5A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 20px; font-weight: 900; text-decoration: none; box-shadow: 0 10px 22px rgba(15,94,90,0.25)">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>
              بله، بفرست
            </a>
          </sc-if>
          <button type="button" onClick="{{retake}}" style="height: {{retakeH}}; border-radius: 16px; border: {{retakeBorder}}; background: {{retakeBg}}; color: {{retakeColor}}; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 18px; font-weight: 800; cursor: pointer">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8a2 2 0 0 1 2-2h2.5L9 4h6l1.5 2H19a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/></svg>
            {{retakeLabel}}
          </button>
        </div>
      </div>
    </sc-if>
  </main>

  <footer style="padding: 12px 20px 18px; border-top: 1px solid #EADFCF; background: #FBF7F0">
    <button type="button" style="width: 100%; height: 54px; border-radius: 14px; border: 1.5px solid #0F5E5A; background: #FFFFFF; color: #0F5E5A; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 17px; font-weight: 800; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>
      تماس با کارشناس
    </button>
  </footer>
</div>
</template>
<script src="assets/morphdom.min.js"></script>
<script src="assets/hv-runtime.js"></script>
<script>
class Component extends DCLogic {
  renderVals() {
    const step = (this.state && this.state.step) || 'camera';
    const blurry = !!(this.props.blurry ?? false);
    return {
      isCamera: step === 'camera',
      isPreview: step === 'preview',
      blurry: blurry,
      sharp: !blurry,
      docFilter: blurry ? 'blur(2.2px)' : 'none',
      retakeLabel: blurry ? 'دوباره عکس بگیر' : 'نه، دوباره می‌گیرم',
      retakeH: blurry ? '64px' : '56px',
      retakeBg: blurry ? '#0F5E5A' : '#FFFFFF',
      retakeColor: blurry ? '#FFFFFF' : '#1F2328',
      retakeBorder: blurry ? 'none' : '1.5px solid #D9CDB8',
      shoot: () => this.setState({ step: 'preview' }),
      retake: () => this.setState({ step: 'camera' })
    };
  }
}
HV.mount(Component, {"blurry": {"editor": "boolean", "default": false, "section": "پیش‌نمایش عکس"}});
</script>
</body>
</html>

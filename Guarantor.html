<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0F5E5A">
<title>همیار وام · ضامن</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/site.css">
<style>
body{margin:0;background:#FBF7F0}
*{box-sizing:border-box}
button,input{font-family:inherit}
a{color:#0F5E5A}a:hover{color:#0B4744}
input::placeholder{color:#A39B90}
input:focus{outline:3px solid rgba(15,94,90,0.35);outline-offset:2px}
</style>
</head>
<body class="hv-mobile">
<div id="hv-app"></div>
<template id="hv-tpl">
<div class="hv-root" dir="rtl" style="width: 390px; height: 1340px; display: flex; flex-direction: column; background: #FBF7F0; color: #1F2328; font-family: 'Vazirmatn', Tahoma, sans-serif; font-size: 18px; line-height: 1.8; overflow: hidden">

  <header style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px 6px">
    <a href="Checklist.dc.html" aria-label="بازگشت" style="width: 48px; height: 48px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E8DDCB; display: flex; align-items: center; justify-content: center; color: #1F2328">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
    </a>
    <button type="button" style="height: 48px; padding: 0 16px; border-radius: 999px; border: none; background: #E2EEEB; color: #0B4744; display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      برایم بخوان
    </button>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 12px 20px 16px; min-height: 0">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-size: 28px; line-height: 1.5; font-weight: 900">ضامن دارید؟</h1>
      <p style="margin: 0; font-size: 16px; line-height: 1.75; color: #57534E">شاید بانک بعد از بررسی خوش‌حسابی ضامن بخواهد. اگر کسی را در نظر دارید، همین حالا معرفی کنید.</p>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <button type="button" onClick="{{pickYes}}" aria-pressed="{{isYes}}" style="height: 76px; border-radius: 20px; border: 2.5px solid {{yesB}}; background: {{yesBg}}; color: #1F2328; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 20px; font-weight: 900; cursor: pointer">
        <span style="width: 34px; height: 34px; border-radius: 50%; background: #0F5E5A; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>
        بله، دارم
      </button>
      <button type="button" onClick="{{pickNo}}" aria-pressed="{{isNo}}" style="height: 76px; border-radius: 20px; border: 2.5px solid {{noB}}; background: {{noBg}}; color: #1F2328; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 20px; font-weight: 900; cursor: pointer">
        <span style="width: 34px; height: 34px; border-radius: 50%; background: #57534E; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></span>
        نه، ندارم
      </button>
    </div>

    <sc-if value="{{isYes}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; flex-direction: column; gap: 16px">
        <section style="border-radius: 22px; background: #FFFFFF; border: 1px solid #EADFCF; padding: 16px; display: flex; flex-direction: column; gap: 14px">
          <div style="display: flex; flex-direction: column; gap: 6px">
            <label for="hv-gname" style="font-size: 16px; font-weight: 700">نام و نام خانوادگی ضامن</label>
            <input id="hv-gname" type="text" placeholder="مثلاً حسین مرادی" style="height: 60px; border-radius: 14px; border: 2px solid #D9CDB8; background: #FFFFFF; padding: 0 16px; font-size: 19px; font-weight: 600; color: #1F2328">
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px">
            <label for="hv-gphone" style="font-size: 16px; font-weight: 700">شماره موبایل ضامن</label>
            <input id="hv-gphone" type="tel" inputmode="numeric" dir="ltr" placeholder="۰۹۱۲ ۰۰۰ ۰۰۰۰" style="height: 60px; border-radius: 14px; border: 2px solid #D9CDB8; background: #FFFFFF; padding: 0 16px; font-size: 21px; font-weight: 700; letter-spacing: 1px; text-align: center; color: #1F2328">
          </div>
          <div style="display: flex; gap: 10px; align-items: flex-start; font-size: 15px; color: #0B4744; background: #E2EEEB; border-radius: 14px; padding: 10px 12px; line-height: 1.7; font-weight: 600">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 4px"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
            ضامن لازم نیست کارمند دولت باشد؛ کافی است خودش هم بررسی خوش‌حسابی را بگذراند.
          </div>
        </section>

        <section style="display: flex; flex-direction: column; gap: 10px">
          <span style="font-size: 16px; font-weight: 800; color: #57534E">ضامن این صفحه را می‌بیند:</span>
          <div style="border-radius: 30px; background: #22302E; padding: 10px; box-shadow: 0 16px 30px rgba(34,48,46,0.25)">
            <div style="border-radius: 22px; background: #FBF7F0; padding: 16px; display: flex; flex-direction: column; gap: 12px">
              <div style="display: flex; align-items: center; gap: 8px">
                <svg width="28" height="28" viewBox="0 0 40 40" aria-hidden="true"><path d="M5 38V19a15 15 0 0 1 30 0v19z" fill="#0F5E5A"/><circle cx="20" cy="17.5" r="5.2" fill="#E9B949"/><path d="M11 27.5c2.8 2.6 5.8 3.8 9 3.8s6.2-1.2 9-3.8" stroke="#FBF7F0" stroke-width="2.8" fill="none" stroke-linecap="round"/></svg>
                <span style="font-size: 16px; font-weight: 900; color: #0B4744">همیار وام</span>
              </div>
              <p style="margin: 0; font-size: 17px; font-weight: 800; line-height: 1.7">سلام. آقای رضا کریمی شما را به‌عنوان ضامن وامش معرفی کرده است.</p>
              <div style="display: flex; flex-direction: column; gap: 6px; font-size: 15px; font-weight: 600">
                <span style="display: flex; gap: 8px; align-items: center"><span style="width: 8px; height: 8px; border-radius: 50%; background: #0F5E5A"></span>کارت ملی و شناسنامه</span>
                <span style="display: flex; gap: 8px; align-items: center"><span style="width: 8px; height: 8px; border-radius: 50%; background: #0F5E5A"></span>فیش حقوقی یا جواز کسب</span>
                <span style="display: flex; gap: 8px; align-items: center"><span style="width: 8px; height: 8px; border-radius: 50%; background: #0F5E5A"></span>تعهدنامه دیجیتال (سفته الکترونیک) را خودتان امضا می‌کنید</span>
              </div>
              <span style="height: 50px; border-radius: 14px; background: #0F5E5A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800">شروع فرستادن مدارک</span>
              <span style="text-align: center; font-size: 14px; font-weight: 700; color: #57534E">نمی‌توانم ضامن شوم</span>
            </div>
          </div>
        </section>
      </div>
    </sc-if>

    <sc-if value="{{isNo}}" hint-placeholder-val="{{false}}">
      <section style="border-radius: 22px; background: #FFFFFF; border: 1px solid #EADFCF; padding: 18px; display: flex; flex-direction: column; gap: 10px">
        <span style="width: 56px; height: 64px; border-radius: 28px 28px 12px 12px; background: #E5F2E5; color: #1B5E20; display: flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4 6v6c0 4.5 3.4 8.3 8 9 4.6-.7 8-4.5 8-9V6z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg></span>
        <span style="font-size: 21px; font-weight: 900">اشکالی ندارد</span>
        <p style="margin: 0; font-size: 16px; line-height: 1.8; color: #3F3B36">شاید اصلاً لازم نشود. نتیجه بررسی خوش‌حسابی معلوم می‌کند. اگر بانک ضامن خواست، خبرتان می‌کنیم و با هم راهش را پیدا می‌کنیم.</p>
      </section>
    </sc-if>
  </main>

  <footer style="padding: 12px 20px 18px; border-top: 1px solid #EADFCF; background: #FBF7F0; display: flex; flex-direction: column; gap: 10px">
    <sc-if value="{{isYes}}" hint-placeholder-val="{{true}}">
      <a href="Checklist.dc.html" style="width: 100%; height: 60px; border-radius: 16px; background: #0F5E5A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 19px; font-weight: 800; text-decoration: none; box-shadow: 0 8px 18px rgba(15,94,90,0.22)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/></svg>
        فرستادن لینک برای ضامن
      </a>
    </sc-if>
    <sc-if value="{{isNo}}" hint-placeholder-val="{{false}}">
      <a href="Checklist.dc.html" style="width: 100%; height: 60px; border-radius: 16px; background: #0F5E5A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 19px; font-weight: 800; text-decoration: none; box-shadow: 0 8px 18px rgba(15,94,90,0.22)">
        ادامه
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m11 6-6 6 6 6"/></svg>
      </a>
    </sc-if>
    <button type="button" style="width: 100%; height: 52px; border-radius: 14px; border: 1.5px solid #0F5E5A; background: #FFFFFF; color: #0F5E5A; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 17px; font-weight: 800; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>
      تماس با کارشناس
    </button>
  </footer>
</div>
</template>
<script src="assets/morphdom.min.js"></script>
<script src="assets/hv-runtime.js"></script>
<script>
class Component extends DCLogic {
  renderVals() {
    const has = (this.state && this.state.has) || 'yes';
    const yes = has === 'yes';
    return {
      isYes: yes,
      isNo: !yes,
      yesB: yes ? '#0F5E5A' : '#E2D8C6',
      yesBg: yes ? '#F4FAF8' : '#FFFFFF',
      noB: !yes ? '#0F5E5A' : '#E2D8C6',
      noBg: !yes ? '#F4FAF8' : '#FFFFFF',
      pickYes: () => this.setState({ has: 'yes' }),
      pickNo: () => this.setState({ has: 'no' })
    };
  }
}
HV.mount(Component, {});
</script>
</body>
</html>

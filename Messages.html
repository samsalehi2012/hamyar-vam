<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0F5E5A">
<title>همیار وام · پیام‌ها</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/site.css">
<style>
body{margin:0;background:#FBF7F0}
*{box-sizing:border-box}
button,input{font-family:inherit}
a{color:#0F5E5A}a:hover{color:#0B4744}
@keyframes hvRec{0%,100%{opacity:1}50%{opacity:.25}}
.hv-rec{animation:hvRec 1s ease-in-out infinite}
</style>
</head>
<body class="hv-mobile">
<div id="hv-app"></div>
<template id="hv-tpl">
<div class="hv-root" dir="rtl" style="width: 390px; height: 1280px; display: flex; flex-direction: column; background: #FBF7F0; color: #1F2328; font-family: 'Vazirmatn', Tahoma, sans-serif; font-size: 18px; line-height: 1.8; overflow: hidden">

  <header style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px 6px">
    <a href="Tracking.dc.html" aria-label="بازگشت" style="width: 48px; height: 48px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E8DDCB; display: flex; align-items: center; justify-content: center; color: #1F2328">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
    </a>
    <button type="button" style="height: 48px; padding: 0 16px; border-radius: 999px; border: none; background: #E2EEEB; color: #0B4744; display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      برایم بخوان
    </button>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 12px 20px 16px; min-height: 0">
    <h1 style="margin: 0; font-size: 28px; line-height: 1.5; font-weight: 900">پیام‌ها</h1>

    <section style="border-radius: 20px; background: #FFFFFF; border: 1px solid #EADFCF; padding: 12px 14px; display: flex; align-items: center; gap: 12px">
      <span style="width: 52px; height: 58px; flex: none; border-radius: 26px 26px 12px 12px; background: #E9DCC5; color: #6B4E1F; font-size: 22px; font-weight: 900; display: flex; align-items: center; justify-content: center">س</span>
      <span style="flex: 1; display: flex; flex-direction: column; line-height: 1.5">
        <span style="font-size: 17px; font-weight: 800">سارا رحیمی</span>
        <span style="font-size: 14px; color: #57534E">کارشناس پرونده شما</span>
      </span>
      <button type="button" aria-label="تماس با سارا رحیمی" style="width: 48px; height: 48px; border-radius: 50%; border: none; background: #E2EEEB; color: #0F5E5A; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg></button>
    </section>

    <div style="display: flex; align-items: center; gap: 10px; color: #57534E; font-size: 14px; font-weight: 700">
      <span style="flex: 1; height: 1px; background: #E6DCCB"></span>امروز · شنبه ۱۱ مهر<span style="flex: 1; height: 1px; background: #E6DCCB"></span>
    </div>

    <article style="align-self: flex-start; max-width: 318px; border-radius: 22px 6px 22px 22px; background: #FFFFFF; border: 1px solid #EADFCF; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; align-items: center; gap: 10px">
        <button type="button" onClick="{{play1}}" aria-label="پخش پیام صوتی" style="width: 44px; height: 44px; flex: none; border-radius: 50%; border: none; background: #0F5E5A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg></button>
        <span style="flex: 1; display: flex; align-items: center; gap: 3px; height: 26px">
          <span style="width: 3px; height: 8px; border-radius: 9px; background: {{w1}}"></span><span style="width: 3px; height: 16px; border-radius: 9px; background: {{w1}}"></span><span style="width: 3px; height: 22px; border-radius: 9px; background: {{w1}}"></span><span style="width: 3px; height: 12px; border-radius: 9px; background: {{w1}}"></span><span style="width: 3px; height: 18px; border-radius: 9px; background: #D9CDB8"></span><span style="width: 3px; height: 10px; border-radius: 9px; background: #D9CDB8"></span><span style="width: 3px; height: 20px; border-radius: 9px; background: #D9CDB8"></span><span style="width: 3px; height: 14px; border-radius: 9px; background: #D9CDB8"></span><span style="width: 3px; height: 8px; border-radius: 9px; background: #D9CDB8"></span><span style="width: 3px; height: 18px; border-radius: 9px; background: #D9CDB8"></span><span style="width: 3px; height: 12px; border-radius: 9px; background: #D9CDB8"></span><span style="width: 3px; height: 22px; border-radius: 9px; background: #D9CDB8"></span><span style="width: 3px; height: 10px; border-radius: 9px; background: #D9CDB8"></span><span style="width: 3px; height: 16px; border-radius: 9px; background: #D9CDB8"></span>
        </span>
        <span style="font-size: 14px; font-weight: 700; color: #57534E">۰:۱۲</span>
      </div>
      <p style="margin: 0; font-size: 17px; line-height: 1.75">سلام آقای کریمی. کارت ملی و شماره حسابتان تأیید شد. ممنون!</p>
      <span style="font-size: 13px; color: #57534E; align-self: flex-end">۹:۱۲</span>
    </article>

    <article style="align-self: flex-start; max-width: 318px; border-radius: 22px 6px 22px 22px; background: #FFFFFF; border: 1px solid #EADFCF; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; align-items: center; gap: 10px">
        <button type="button" aria-label="پخش پیام صوتی" style="width: 44px; height: 44px; flex: none; border-radius: 50%; border: none; background: #0F5E5A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg></button>
        <span style="flex: 1; display: flex; align-items: center; gap: 3px; height: 26px">
          <span style="width: 3px; height: 14px; border-radius: 9px; background: #D9CDB8"></span><span style="width: 3px; height: 20px; border-radius: 9px; background: #D9CDB8"></span><span style="width: 3px; height: 10px; border-radius: 9px; background: #D9CDB8"></span><span style="width: 3px; height: 22px; border-radius: 9px; background: #D9CDB8"></span><span style="width: 3px; height: 16px; border-radius: 9px; background: #D9CDB8"></span><span style="width: 3px; height: 8px; border-radius: 9px; background: #D9CDB8"></span><span style="width: 3px; height: 18px; border-radius: 9px; background: #D9CDB8"></span><span style="width: 3px; height: 12px; border-radius: 9px; background: #D9CDB8"></span><span style="width: 3px; height: 22px; border-radius: 9px; background: #D9CDB8"></span><span style="width: 3px; height: 10px; border-radius: 9px; background: #D9CDB8"></span><span style="width: 3px; height: 16px; border-radius: 9px; background: #D9CDB8"></span><span style="width: 3px; height: 20px; border-radius: 9px; background: #D9CDB8"></span><span style="width: 3px; height: 12px; border-radius: 9px; background: #D9CDB8"></span><span style="width: 3px; height: 8px; border-radius: 9px; background: #D9CDB8"></span>
        </span>
        <span style="font-size: 14px; font-weight: 700; color: #57534E">۰:۲۴</span>
      </div>
      <p style="margin: 0; font-size: 17px; line-height: 1.75">عکس شناسنامه پسرتان کمی تار بود. لطفاً در نور روز یک‌بار دیگر بگیرید.</p>
      <a href="Upload.dc.html" style="min-height: 46px; border-radius: 12px; background: #FCEFD9; color: #92400E; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 800; text-decoration: none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8a2 2 0 0 1 2-2h2.5L9 4h6l1.5 2H19a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/></svg>
        عکس دوباره
      </a>
      <span style="font-size: 13px; color: #57534E; align-self: flex-end">۹:۱۵</span>
    </article>

    <article style="align-self: flex-end; max-width: 280px; border-radius: 6px 22px 22px 22px; background: #0F5E5A; color: #FFFFFF; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; align-items: center; gap: 10px">
        <button type="button" aria-label="پخش پیام صوتی من" style="width: 44px; height: 44px; flex: none; border-radius: 50%; border: none; background: #FBF7F0; color: #0B4744; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg></button>
        <span style="flex: 1; display: flex; align-items: center; gap: 3px; height: 26px">
          <span style="width: 3px; height: 10px; border-radius: 9px; background: #9FD3CB"></span><span style="width: 3px; height: 18px; border-radius: 9px; background: #9FD3CB"></span><span style="width: 3px; height: 14px; border-radius: 9px; background: #9FD3CB"></span><span style="width: 3px; height: 22px; border-radius: 9px; background: #9FD3CB"></span><span style="width: 3px; height: 8px; border-radius: 9px; background: #9FD3CB"></span><span style="width: 3px; height: 16px; border-radius: 9px; background: #9FD3CB"></span><span style="width: 3px; height: 20px; border-radius: 9px; background: #9FD3CB"></span><span style="width: 3px; height: 12px; border-radius: 9px; background: #9FD3CB"></span><span style="width: 3px; height: 18px; border-radius: 9px; background: #9FD3CB"></span><span style="width: 3px; height: 10px; border-radius: 9px; background: #9FD3CB"></span>
        </span>
        <span style="font-size: 14px; font-weight: 700; color: #CFE6E2">۰:۰۸</span>
      </div>
      <span style="font-size: 13px; color: #CFE6E2; display: flex; align-items: center; gap: 4px; align-self: flex-start">۹:۴۰ · شنیده شد <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m2 12.5 4.5 4.5L16 7.5"/><path d="m10 16 1 1L20.5 7.5"/></svg></span>
    </article>

    <article style="align-self: flex-start; max-width: 318px; border-radius: 22px 6px 22px 22px; background: #FFFFFF; border: 1px solid #EADFCF; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
      <p style="margin: 0; font-size: 17px; line-height: 1.75">جلسه همراهی شما ثبت شد:</p>
      <div style="border-radius: 14px; background: #F3EBDD; padding: 10px 12px; display: flex; align-items: center; gap: 10px">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0F5E5A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3"/></svg>
        <span style="font-size: 16px; font-weight: 800; line-height: 1.6">یکشنبه ۱۲ مهر، ساعت ۱۰:۳۰<br><span style="font-weight: 600; color: #57534E; font-size: 14px">تماس تصویری</span></span>
      </div>
      <span style="font-size: 13px; color: #57534E; align-self: flex-end">۱۰:۰۲</span>
    </article>
  </main>

  <footer style="padding: 12px 20px 18px; border-top: 1px solid #EADFCF; background: #FFFFFF; display: flex; flex-direction: column; gap: 10px">
    <sc-if value="{{recording}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 800; color: #A32014">
        <span class="hv-rec" style="width: 12px; height: 12px; border-radius: 50%; background: #D84B3B"></span>
        در حال ضبط… ۰:۰۵ — برای فرستادن دوباره بزنید
      </div>
    </sc-if>
    <div style="display: flex; gap: 10px">
      <button type="button" onClick="{{toggleRec}}" style="flex: 1; height: 64px; border-radius: 18px; border: none; background: {{micBg}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 18px; font-weight: 900; cursor: pointer; box-shadow: 0 8px 18px rgba(15,94,90,0.2)">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
        {{micLabel}}
      </button>
      <button type="button" aria-label="نوشتن پیام" style="width: 64px; height: 64px; flex: none; border-radius: 18px; border: 1.5px solid #D9CDB8; background: #FBF7F0; color: #1F2328; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg></button>
    </div>
    <button type="button" style="width: 100%; height: 52px; border-radius: 14px; border: 1.5px solid #0F5E5A; background: #FFFFFF; color: #0F5E5A; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 17px; font-weight: 800; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>
      تماس با کارشناس
    </button>
  </footer>
</div>
</template>
<script src="assets/morphdom.min.js"></script>
<script src="assets/hv-runtime.js"></script>
<script>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const rec = !!s.rec;
    const p1 = !!s.p1;
    return {
      recording: rec,
      micBg: rec ? '#B42318' : '#0F5E5A',
      micLabel: rec ? 'فرستادن پیام صوتی' : 'پاسخ صوتی',
      toggleRec: () => this.setState({ rec: !rec }),
      w1: p1 ? '#0F5E5A' : '#D9CDB8',
      play1: () => this.setState({ p1: !p1 })
    };
  }
}
HV.mount(Component, {});
</script>
</body>
</html>

<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0F5E5A">
<title>همیار وام · مدارک من</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/site.css">
<style>
body{margin:0;background:#FBF7F0}
*{box-sizing:border-box}
button,input{font-family:inherit}
a{color:#0F5E5A}a:hover{color:#0B4744}
</style>
</head>
<body class="hv-mobile">
<div id="hv-app"></div>
<template id="hv-tpl">
<div class="hv-root" dir="rtl" style="width: 390px; height: 2000px; display: flex; flex-direction: column; background: #FBF7F0; color: #1F2328; font-family: 'Vazirmatn', Tahoma, sans-serif; font-size: 18px; line-height: 1.8; overflow: hidden">

  <header style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px 6px">
    <a href="Result.dc.html" aria-label="بازگشت" style="width: 48px; height: 48px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E8DDCB; display: flex; align-items: center; justify-content: center; color: #1F2328">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
    </a>
    <button type="button" style="height: 48px; padding: 0 16px; border-radius: 999px; border: none; background: #E2EEEB; color: #0B4744; display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      برایم بخوان
    </button>
  </header>

  <div style="padding: 8px 20px 0; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: space-between; align-items: center; font-size: 15px; color: #57534E">
      <span style="font-weight: 800; color: #0B4744">مرحله ۴ از ۵ · مدارک</span>
      <span style="display: flex; align-items: center; gap: 6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2E7D32" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>ذخیره شد</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
      <span style="height: 8px; border-radius: 99px; background: #0F5E5A"></span>
      <span style="height: 8px; border-radius: 99px; background: #0F5E5A"></span>
      <span style="height: 8px; border-radius: 99px; background: #0F5E5A"></span>
      <span style="height: 8px; border-radius: 99px; background: #0F5E5A"></span>
      <span style="height: 8px; border-radius: 99px; background: #E6DCCB"></span>
    </div>
  </div>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 20px 20px 16px; min-height: 0">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h1 style="margin: 0; font-size: 27px; line-height: 1.5; font-weight: 900">مدارک شما</h1>
      <div style="display: flex; flex-wrap: wrap; gap: 6px">
        <span style="font-size: 14px; font-weight: 700; background: #F3EBDD; border-radius: 999px; padding: 2px 12px">وام عادی</span>
        <span style="font-size: 14px; font-weight: 700; background: #F3EBDD; border-radius: 999px; padding: 2px 12px">بازنشسته</span>
        <span style="font-size: 14px; font-weight: 700; background: #F3EBDD; border-radius: 999px; padding: 2px 12px">از امتیاز پسرتان</span>
      </div>
    </div>

    <section style="position: relative; overflow: hidden; border-radius: 24px; background: #0F5E5A; color: #FFFFFF; padding: 18px; display: flex; flex-direction: column; gap: 12px">
      <div aria-hidden="true" style="position: absolute; left: -26px; top: -20px; width: 120px; height: 150px; border-radius: 60px 60px 0 0; border: 2px solid rgba(255,255,255,0.12)"></div>
      <div aria-hidden="true" style="position: absolute; left: 4px; top: 10px; width: 60px; height: 90px; border-radius: 30px 30px 0 0; border: 2px solid rgba(255,255,255,0.1)"></div>
      <div style="display: flex; align-items: baseline; gap: 8px">
        <span style="font-size: 40px; font-weight: 900; line-height: 1.2">۲</span>
        <span style="font-size: 18px; font-weight: 700; color: #CFE6E2">از ۶ مدرک تأیید شده</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 5px">
        <span style="height: 10px; border-radius: 99px; background: #7CD08A"></span>
        <span style="height: 10px; border-radius: 99px; background: #7CD08A"></span>
        <span style="height: 10px; border-radius: 99px; background: #9FD3CB"></span>
        <span style="height: 10px; border-radius: 99px; background: {{seg4}}"></span>
        <span style="height: 10px; border-radius: 99px; background: {{seg5}}"></span>
        <span style="height: 10px; border-radius: 99px; background: rgba(255,255,255,0.22)"></span>
      </div>
      <span style="font-size: 15px; color: #E3F1EE; font-weight: 600">{{summary}}</span>
    </section>

    <h2 style="margin: 4px 0 0; font-size: 19px; font-weight: 900">مدارک خودتان</h2>

    <article style="border-radius: 20px; background: #FFFFFF; border: 1px solid #EADFCF; padding: 14px; display: flex; gap: 12px; align-items: center">
      <span style="width: 54px; height: 62px; flex: none; border-radius: 27px 27px 12px 12px; background: #E2EEEB; color: #0F5E5A; display: flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2.2"/><path d="M5.8 16c.6-1.6 1.8-2.4 3.2-2.4s2.6.8 3.2 2.4"/><path d="M14.5 10h4M14.5 13.5h3"/></svg></span>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 4px; line-height: 1.5">
        <span style="font-size: 17px; font-weight: 800">کارت ملی هوشمند</span>
        <span style="font-size: 14px; color: #57534E">پشت و رو</span>
        <span style="align-self: flex-start; display: flex; align-items: center; gap: 5px; font-size: 14px; font-weight: 800; background: #E5F2E5; color: #1B5E20; border-radius: 999px; padding: 2px 10px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>تأیید شد</span>
      </div>
    </article>

    <sc-if value="{{notSent}}" hint-placeholder-val="{{true}}">
      <article style="position: relative; border-radius: 20px; background: #FFFFFF; border: 2.5px solid #0F5E5A; padding: 14px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 10px 24px rgba(15,94,90,0.12)">
        <span style="position: absolute; top: -13px; right: 16px; font-size: 13px; font-weight: 800; background: #0F5E5A; color: #FFFFFF; border-radius: 999px; padding: 0 12px">نوبت شما</span>
        <div style="display: flex; gap: 12px; align-items: center">
          <span style="width: 54px; height: 62px; flex: none; border-radius: 27px 27px 12px 12px; background: #E2EEEB; color: #0F5E5A; display: flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/><path d="M10 8h5"/></svg></span>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 4px; line-height: 1.5">
            <span style="font-size: 17px; font-weight: 800">شناسنامه</span>
            <span style="font-size: 14px; color: #57534E">صفحه اول؛ و صفحه توضیحات اگر چیزی در آن نوشته شده</span>
            <span style="align-self: flex-start; display: flex; align-items: center; gap: 5px; font-size: 14px; font-weight: 800; background: #F1ECE4; color: #57534E; border-radius: 999px; padding: 2px 10px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></svg>هنوز نفرستاده‌اید</span>
          </div>
        </div>
        <a href="Upload.dc.html" style="height: 52px; border-radius: 14px; background: #0F5E5A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 17px; font-weight: 800; text-decoration: none">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8a2 2 0 0 1 2-2h2.5L9 4h6l1.5 2H19a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/></svg>
          عکس بگیرید و بفرستید
        </a>
      </article>
    </sc-if>
    <sc-if value="{{sent}}" hint-placeholder-val="{{false}}">
      <article style="border-radius: 20px; background: #FFFFFF; border: 1px solid #EADFCF; padding: 14px; display: flex; gap: 12px; align-items: center">
        <span style="width: 54px; height: 62px; flex: none; border-radius: 27px 27px 12px 12px; background: #E2EEEB; color: #0F5E5A; display: flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/><path d="M10 8h5"/></svg></span>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 4px; line-height: 1.5">
          <span style="font-size: 17px; font-weight: 800">شناسنامه</span>
          <span style="font-size: 14px; color: #57534E">صفحه اول؛ همین الان رسید</span>
          <span style="align-self: flex-start; display: flex; align-items: center; gap: 5px; font-size: 14px; font-weight: 800; background: #E2EEEB; color: #0B4744; border-radius: 999px; padding: 2px 10px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>فرستاده شد · در حال بررسی</span>
        </div>
      </article>
    </sc-if>

    <article style="border-radius: 20px; background: #FFFFFF; border: 1px solid #EADFCF; padding: 14px; display: flex; gap: 12px; align-items: center">
      <span style="width: 54px; height: 62px; flex: none; border-radius: 27px 27px 12px 12px; background: #E2EEEB; color: #0F5E5A; display: flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg></span>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 4px; line-height: 1.5">
        <span style="font-size: 17px; font-weight: 800">آخرین فیش مستمری</span>
        <span style="font-size: 14px; color: #57534E">فیش حقوق بازنشستگی همین ماه</span>
        <span style="align-self: flex-start; display: flex; align-items: center; gap: 5px; font-size: 14px; font-weight: 800; background: #E2EEEB; color: #0B4744; border-radius: 999px; padding: 2px 10px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>فرستاده شد · در حال بررسی</span>
      </div>
    </article>

    <article style="border-radius: 20px; background: #FFFFFF; border: 1px solid #EADFCF; padding: 14px; display: flex; gap: 12px; align-items: center">
      <span style="width: 54px; height: 62px; flex: none; border-radius: 27px 27px 12px 12px; background: #E2EEEB; color: #0F5E5A; display: flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10 12 4l9 6"/><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8"/><path d="M3 21h18"/></svg></span>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 4px; line-height: 1.5">
        <span style="font-size: 17px; font-weight: 800">شماره حساب قرض‌الحسنه رسالت</span>
        <span style="font-size: 14px; color: #57534E">عکس کارت بانکی یا دفترچه</span>
        <span style="align-self: flex-start; display: flex; align-items: center; gap: 5px; font-size: 14px; font-weight: 800; background: #E5F2E5; color: #1B5E20; border-radius: 999px; padding: 2px 10px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>تأیید شد</span>
      </div>
    </article>

    <h2 style="margin: 4px 0 0; font-size: 19px; font-weight: 900">مدارک پسرتان (صاحب امتیاز)</h2>

    <article style="border-radius: 20px; background: #FFFBF3; border: 1.5px solid #EBC889; padding: 14px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; gap: 12px; align-items: center">
        <span style="width: 54px; height: 62px; flex: none; border-radius: 27px 27px 12px 12px; background: #FCEFD9; color: #92400E; display: flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/><path d="M10 8h5"/></svg></span>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 4px; line-height: 1.5">
          <span style="font-size: 17px; font-weight: 800">شناسنامه پسرتان</span>
          <span style="font-size: 14px; color: #57534E">برای نشان دادن نسبت خانوادگی</span>
          <span style="align-self: flex-start; display: flex; align-items: center; gap: 5px; font-size: 14px; font-weight: 800; background: #FCEFD9; color: #92400E; border-radius: 999px; padding: 2px 10px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.5-4.5L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.5 4.5L20 16"/><path d="M20 20v-4h-4"/></svg>لطفاً دوباره عکس بگیرید</span>
        </div>
      </div>
      <p style="margin: 0; font-size: 15px; color: #7A3A0B; font-weight: 600; line-height: 1.7">عکس کمی تار بود. اشکالی ندارد؛ در نور روز یک‌بار دیگر بگیرید.</p>
      <a href="Upload.dc.html" style="height: 50px; border-radius: 14px; background: #FFFFFF; border: 1.5px solid #B45309; color: #92400E; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 800; text-decoration: none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8a2 2 0 0 1 2-2h2.5L9 4h6l1.5 2H19a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/></svg>
        عکس دوباره
      </a>
    </article>

    <article style="border-radius: 20px; background: #FFFFFF; border: 1px solid #EADFCF; padding: 14px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; gap: 12px; align-items: center">
        <span style="width: 54px; height: 62px; flex: none; border-radius: 27px 27px 12px 12px; background: #E2EEEB; color: #0F5E5A; display: flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2.2"/><path d="M5.8 16c.6-1.6 1.8-2.4 3.2-2.4s2.6.8 3.2 2.4"/><path d="M14.5 10h4M14.5 13.5h3"/></svg></span>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 4px; line-height: 1.5">
          <span style="font-size: 17px; font-weight: 800">کارت ملی پسرتان</span>
          <span style="font-size: 14px; color: #57534E">پسرتان خودش با لینک پیامکی می‌فرستد</span>
          <span style="align-self: flex-start; display: flex; align-items: center; gap: 5px; font-size: 14px; font-weight: 800; background: #F1ECE4; color: #57534E; border-radius: 999px; padding: 2px 10px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></svg>هنوز نفرستاده</span>
        </div>
      </div>
      <button type="button" style="height: 50px; border-radius: 14px; background: #F3EBDD; border: none; color: #1F2328; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 800; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/></svg>
        فرستادن لینک برای پسرم
      </button>
    </article>

    <h2 style="margin: 4px 0 0; font-size: 19px; font-weight: 900">کارهای بعدی</h2>
    <div style="border-radius: 20px; background: #FFFFFF; border: 1px solid #EADFCF; display: flex; flex-direction: column; overflow: hidden">
      <a href="Guarantor.dc.html" style="min-height: 64px; display: flex; align-items: center; gap: 12px; padding: 10px 14px; color: #1F2328; text-decoration: none; border-bottom: 1px solid #F1E9DC">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0F5E5A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18 14a6.5 6.5 0 0 1 3.5 6"/></svg>
        <span style="flex: 1; font-size: 17px; font-weight: 700">ضامن <span style="font-weight: 500; color: #57534E; font-size: 15px">(اگر لازم شد)</span></span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#57534E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
      </a>
      <a href="Consent.dc.html" style="min-height: 64px; display: flex; align-items: center; gap: 12px; padding: 10px 14px; color: #1F2328; text-decoration: none; border-bottom: 1px solid #F1E9DC">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0F5E5A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg>
        <span style="flex: 1; font-size: 17px; font-weight: 700">رضایت‌نامه ساده</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#57534E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
      </a>
      <a href="Booking.dc.html" style="min-height: 64px; display: flex; align-items: center; gap: 12px; padding: 10px 14px; color: #1F2328; text-decoration: none">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0F5E5A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <span style="flex: 1; font-size: 17px; font-weight: 700">رزرو جلسه همراهی</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#57534E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
      </a>
    </div>
  </main>

  <footer style="padding: 12px 20px 18px; border-top: 1px solid #EADFCF; background: #FBF7F0; display: flex; flex-direction: column; gap: 10px">

<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0F5E5A">
<title>همیار وام · نتیجه</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/site.css">
<style>
body{margin:0;background:#FBF7F0}
*{box-sizing:border-box}
button,input{font-family:inherit}
a{color:#0F5E5A}a:hover{color:#0B4744}
@keyframes hvGlow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.12)}}
.hv-lamp-on{animation:hvGlow 2.4s ease-in-out infinite}
</style>
</head>
<body class="hv-mobile">
<div id="hv-app"></div>
<template id="hv-tpl">
<div class="hv-root" dir="rtl" style="width: 390px; height: 1180px; display: flex; flex-direction: column; background: #FBF7F0; color: #1F2328; font-family: 'Vazirmatn', Tahoma, sans-serif; font-size: 18px; line-height: 1.8; overflow: hidden">

  <header style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px 6px">
    <a href="Questions.dc.html" aria-label="بازگشت" style="width: 48px; height: 48px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E8DDCB; display: flex; align-items: center; justify-content: center; color: #1F2328">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
    </a>
    <button type="button" style="height: 48px; padding: 0 16px; border-radius: 999px; border: none; background: #E2EEEB; color: #0B4744; display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      برایم بخوان
    </button>
  </header>

  <div style="padding: 8px 20px 0; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: space-between; align-items: center; font-size: 15px; color: #57534E">
      <span style="font-weight: 800; color: #0B4744">مرحله ۳ از ۵ · نتیجه اولیه</span>
      <span style="display: flex; align-items: center; gap: 6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2E7D32" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>ذخیره شد</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
      <span style="height: 8px; border-radius: 99px; background: #0F5E5A"></span>
      <span style="height: 8px; border-radius: 99px; background: #0F5E5A"></span>
      <span style="height: 8px; border-radius: 99px; background: #0F5E5A"></span>
      <span style="height: 8px; border-radius: 99px; background: #E6DCCB"></span>
      <span style="height: 8px; border-radius: 99px; background: #E6DCCB"></span>
    </div>
  </div>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 20px 20px 16px; min-height: 0">

    <section style="border-radius: 26px; background: {{tint}}; padding: 18px; display: flex; gap: 18px; align-items: center">
      <div role="img" aria-label="{{lampLabel}}" style="width: 70px; flex: none; border-radius: 35px; background: #22302E; padding: 10px; display: flex; flex-direction: column; gap: 10px; box-shadow: inset 0 2px 6px rgba(0,0,0,0.35), 0 8px 20px rgba(34,48,46,0.25)">
        <span class="{{rCls}}" style="width: 50px; height: 50px; border-radius: 50%; background: {{rBg}}; box-shadow: {{rSh}}; display: flex; align-items: center; justify-content: center; color: #FFFFFF">
          <sc-if value="{{isRed}}" hint-placeholder-val="{{false}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></sc-if>
        </span>
        <span class="{{yCls}}" style="width: 50px; height: 50px; border-radius: 50%; background: {{yBg}}; box-shadow: {{ySh}}; display: flex; align-items: center; justify-content: center; color: #4A2A00">
          <sc-if value="{{isYellow}}" hint-placeholder-val="{{true}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" aria-hidden="true"><path d="M12 6v7M12 18h.01"/></svg></sc-if>
        </span>
        <span class="{{gCls}}" style="width: 50px; height: 50px; border-radius: 50%; background: {{gBg}}; box-shadow: {{gSh}}; display: flex; align-items: center; justify-content: center; color: #FFFFFF">
          <sc-if value="{{isGreen}}" hint-placeholder-val="{{false}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></sc-if>
        </span>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
        <span style="align-self: flex-start; font-size: 14px; font-weight: 800; color: {{ink}}; background: rgba(255,255,255,0.7); border-radius: 999px; padding: 0 12px">{{chip}}</span>
        <h1 style="margin: 0; font-size: 27px; line-height: 1.5; font-weight: 900; color: {{ink}}">{{headline}}</h1>
        <p style="margin: 0; font-size: 16px; line-height: 1.75; color: #3F3B36">{{sub}}</p>
      </div>
    </section>

    <section style="border-radius: 22px; background: #FFFFFF; border: 1px solid #EADFCF; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; gap: 10px">
        <span style="width: 40px; height: 46px; border-radius: 20px 20px 10px 10px; background: #E2EEEB; color: #0F5E5A; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg></span>
        <div style="display: flex; flex-direction: column; line-height: 1.5">
          <span style="font-size: 18px; font-weight: 800">وام قرض‌الحسنه عادی</span>
          <span style="font-size: 14px; color: #57534E">برای خرج زندگی و کار شخصی</span>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <div style="border-radius: 14px; background: #FBF7F0; padding: 8px 10px; display: flex; flex-direction: column; line-height: 1.5">
          <span style="font-size: 13px; color: #57534E">تا</span>
          <span style="font-size: 16px; font-weight: 800">۵۰۰ میلیون</span>
        </div>
        <div style="border-radius: 14px; background: #FBF7F0; padding: 8px 10px; display: flex; flex-direction: column; line-height: 1.5">
          <span style="font-size: 13px; color: #57534E">کارمزد</span>
          <span style="font-size: 16px; font-weight: 800">۴٪</span>
        </div>
        <div style="border-radius: 14px; background: #FBF7F0; padding: 8px 10px; display: flex; flex-direction: column; line-height: 1.5">
          <span style="font-size: 13px; color: #57534E">بازپرداخت</span>
          <span style="font-size: 16px; font-weight: 800">۱ تا ۵ سال</span>
        </div>
      </div>
    </section>

    <sc-if value="{{isYellow}}" hint-placeholder-val="{{true}}">
      <section style="display: flex; flex-direction: column; gap: 10px">
        <h2 style="margin: 0; font-size: 19px; font-weight: 900">دو کار اضافه لازم است</h2>
        <div style="display: flex; gap: 12px; border-radius: 18px; background: #FFFFFF; border: 1px solid #EADFCF; padding: 14px">
          <span style="width: 34px; height: 34px; flex: none; border-radius: 50%; background: #FCEFD9; color: #92400E; font-weight: 900; display: flex; align-items: center; justify-content: center">۱</span>
          <div style="display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 17px; font-weight: 800; line-height: 1.6">پسرتان امتیاز حسابش را به نام شما ثبت کند</span>
            <span style="font-size: 15px; color: #57534E; line-height: 1.7">در ام‌رسالت، بخش «برآورد تسهیلات». راهنمای قدم‌به‌قدم را برایش پیامک می‌کنیم.</span>
          </div>
        </div>
        <div style="display: flex; gap: 12px; border-radius: 18px; background: #FFFFFF; border: 1px solid #EADFCF; padding: 14px">
          <span style="width: 34px; height: 34px; flex: none; border-radius: 50%; background: #FCEFD9; color: #92400E; font-weight: 900; display: flex; align-items: center; justify-content: center">۲</span>
          <div style="display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 17px; font-weight: 800; line-height: 1.6">بررسی خوش‌حسابی (اعتبارسنجی مرآت)</span>
            <span style="font-size: 15px; color: #57534E; line-height: 1.7">فرمش را ما آماده می‌کنیم؛ کد پیامکی را فقط خودتان وارد می‌کنید.</span>
          </div>
        </div>
      </section>
    </sc-if>

    <sc-if value="{{isGreen}}" hint-placeholder-val="{{false}}">
      <section style="display: flex; gap: 12px; border-radius: 18px; background: #FFFFFF; border: 1px solid #EADFCF; padding: 14px">
        <span style="width: 34px; height: 34px; flex: none; border-radius: 50%; background: #E5F2E5; color: #1B5E20; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m11 6-6 6 6 6"/></svg></span>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 17px; font-weight: 800; line-height: 1.6">قدم بعدی: فرستادن مدارک</span>
          <span style="font-size: 15px; color: #57534E; line-height: 1.7">فهرست مدارک را بر اساس جواب‌هایتان آماده کرده‌ایم. با عکس گوشی بفرستید.</span>
        </div>
      </section>
    </sc-if>

    <sc-if value="{{isRed}}" hint-placeholder-val="{{false}}">
      <section style="display: flex; flex-direction: column; gap: 10px">
        <div style="border-radius: 18px; background: #FFFFFF; border: 1px solid #EADFCF; padding: 14px; display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 15px; font-weight: 800; color: #A32014">دلیل</span>
          <span style="font-size: 17px; font-weight: 700; line-height: 1.7">چک برگشتی یا قسط عقب‌افتاده، بررسی خوش‌حسابی را رد می‌کند.</span>
        </div>
        <div style="border-radius: 18px; background: #FFFFFF; border: 1px solid #EADFCF; padding: 14px; display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 15px; font-weight: 800; color: #0F5E5A">راه‌حل</span>
          <span style="font-size: 17px; font-weight: 700; line-height: 1.7">اول چک را رفع سوءاثر کنید یا قسط عقب‌افتاده را بپردازید. بعد دوباره همین پرسش‌ها را جواب بدهید. در این کار کنارتان هستیم.</span>
        </div>
      </section>
    </sc-if>

    <div style="display: flex; gap: 10px; align-items: flex-start; border-radius: 16px; border: 1.5px dashed #D9CDB8; padding: 12px 14px; color: #3F3B36">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 3px"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
      <span style="font-size: 15px; font-weight: 600; line-height: 1.75">تصمیم نهایی با بانک است. این نتیجه فقط یک برآورد اولیه است، نه تأیید وام.</span>
    </div>
  </main>

  <footer style="padding: 12px 20px 18px; border-top: 1px solid #EADFCF; background: #FBF7F0; display: flex; flex-direction: column; gap: 10px">
    <sc-if value="{{canGo}}" hint-placeholder-val="{{true}}">
      <a href="Checklist.dc.html" style="width: 100%; height: 60px; border-radius: 16px; background: #0F5E5A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 19px; font-weight: 800; text-decoration: none; box-shadow: 0 8px 18px rgba(15,94,90,0.22)">
        ادامه: فهرست مدارک من
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m11 6-6 6 6 6"/></svg>
      </a>
    </sc-if>
    <div style="display: flex; gap: 10px">
      <a href="Calculator.dc.html" style="flex: 1; height: 52px; border-radius: 14px; background: #F3EBDD; color: #1F2328; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 700; text-decoration: none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8"/><path d="M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"/></svg>
        ماشین‌حساب وام
      </a>
      <button type="button" style="flex: 1; height: 52px; border-radius: 14px; border: 1.5px solid #0F5E5A; background: #FFFFFF; color: #0F5E5A; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 800; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>
        تماس با کارشناس
      </button>
    </div>
  </footer>
</div>
</template>
<script src="assets/morphdom.min.js"></script>
<script src="assets/hv-runtime.js"></script>
<script>
class Component extends DCLogic {
  renderVals() {
    const v = this.props.variant ?? 'yellow';
    const off = '#3A4745';
    const offSh = 'inset 0 2px 4px rgba(0,0,0,0.4)';
    const map = {
      green: { tint: '#E6F2E6', ink: '#1B5E20', chip: 'چراغ سبز', headline: 'احتمالاً می‌توانید وام بگیرید', sub: 'جواب‌های شما با شرایط وام عادی می‌خواند.', label: 'چراغ سبز: احتمالاً می‌توانید وام بگیرید' },
      yellow: { tint: '#FCF0DA', ink: '#7A3A0B', chip: 'چراغ زرد', headline: 'با یک کار اضافه ممکن است', sub: 'چون وام از امتیاز پسرتان است، چند کار کوچک باید انجام شود.', label: 'چراغ زرد: با کار اضافه ممکن است' },
      red: { tint: '#FBE8E5', ink: '#A32014', chip: 'چراغ قرمز', headline: 'فعلاً نه', sub: 'ولی راه دارد. دلیلش و کاری که می‌شود کرد را پایین نوشته‌ایم.', label: 'چراغ قرمز: فعلاً نه' }
    };
    const m = map[v] || map.yellow;
    return {
      tint: m.tint, ink: m.ink, chip: m.chip, headline: m.headline, sub: m.sub, lampLabel: m.label,
      isGreen: v === 'green', isYellow: v === 'yellow', isRed: v === 'red',
      canGo: v !== 'red',
      rBg: v === 'red' ? '#D84B3B' : off, rSh: v === 'red' ? '0 0 22px rgba(216,75,59,0.85)' : offSh, rCls: v === 'red' ? 'hv-lamp-on' : '',
      yBg: v === 'yellow' ? '#F4B93A' : off, ySh: v === 'yellow' ? '0 0 22px rgba(244,185,58,0.9)' : offSh, yCls: v === 'yellow' ? 'hv-lamp-on' : '',
      gBg: v === 'green' ? '#3E9D4A' : off, gSh: v === 'green' ? '0 0 22px rgba(62,157,74,0.85)' : offSh, gCls: v === 'green' ? 'hv-lamp-on' : ''
    };
  }
}
HV.mount(Component, {"variant": {"editor": "enum", "options": ["yellow", "green", "red"], "default": "yellow", "section": "نتیجه"}});
</script>
</body>
</html>

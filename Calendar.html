<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0F5E5A">
<title>همیار وام · پنل کارشناس · تقویم جلسات</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/site.css">
<style>
body{margin:0;background:#F6F1E8}
*{box-sizing:border-box}
button,input{font-family:inherit}
a{color:#0F5E5A}a:hover{color:#0B4744}
</style>
</head>
<body class="hv-desktop">
<div id="hv-app"></div>
<template id="hv-tpl">
<div class="hv-root" dir="rtl" style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #F6F1E8; color: #1F2328; font-family: 'Vazirmatn', Tahoma, sans-serif; font-size: 15px; line-height: 1.7">

  <aside style="flex: 1 1 232px; max-width: 100%; background: #0B4744; color: #FFFFFF; padding: 22px 16px; display: flex; flex-direction: column; gap: 22px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 6px">
      <svg width="36" height="36" viewBox="0 0 40 40" aria-hidden="true"><path d="M5 38V19a15 15 0 0 1 30 0v19z" fill="#FBF7F0"/><circle cx="20" cy="17.5" r="5.2" fill="#E9B949"/><path d="M11 27.5c2.8 2.6 5.8 3.8 9 3.8s6.2-1.2 9-3.8" stroke="#0B4744" stroke-width="2.8" fill="none" stroke-linecap="round"/></svg>
      <div style="display: flex; flex-direction: column; line-height: 1.35">
        <span style="font-size: 19px; font-weight: 900">همیار وام</span>
        <span style="font-size: 12px; color: #9FD3CB; font-weight: 600">پنل کارشناس</span>
      </div>
    </div>
    <nav aria-label="منوی پنل" style="display: flex; flex-direction: column; gap: 4px">
      <a href="Dashboard.dc.html" style="height: 46px; border-radius: 12px; color: #CFE6E2; display: flex; align-items: center; gap: 10px; padding: 0 12px; font-weight: 700; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>داشبورد</a>
      <a href="CaseDetail.dc.html" style="height: 46px; border-radius: 12px; color: #CFE6E2; display: flex; align-items: center; gap: 10px; padding: 0 12px; font-weight: 700; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>پرونده‌ها</a>
      <a href="Calendar.dc.html" aria-current="page" style="height: 46px; border-radius: 12px; background: rgba(255,255,255,0.12); color: #FFFFFF; display: flex; align-items: center; gap: 10px; padding: 0 12px; font-weight: 800; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>تقویم جلسات</a>
      <a href="Rules.dc.html" style="height: 46px; border-radius: 12px; color: #CFE6E2; display: flex; align-items: center; gap: 10px; padding: 0 12px; font-weight: 700; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>قواعد وام</a>
    </nav>
    <div style="margin-top: auto; display: flex; align-items: center; gap: 10px; border-radius: 14px; background: rgba(255,255,255,0.08); padding: 10px">
      <span style="width: 40px; height: 40px; border-radius: 50%; background: #E9DCC5; color: #6B4E1F; font-weight: 900; display: flex; align-items: center; justify-content: center">س</span>
      <span style="display: flex; flex-direction: column; line-height: 1.4"><span style="font-weight: 800">سارا رحیمی</span><span style="font-size: 12px; color: #9FD3CB">کارشناس پرونده</span></span>
    </div>
  </aside>

  <main style="flex: 999 1 560px; min-width: 0; padding: 26px 28px 32px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px">
      <div style="display: flex; flex-direction: column; line-height: 1.5">
        <h1 style="margin: 0; font-size: 28px; font-weight: 900">تقویم جلسات همراهی</h1>
        <span style="font-size: 14px; color: #57534E; font-weight: 600">برای ویدیو سلفی، کد پیامکی و امضای تعهدنامه دیجیتال، کنار متقاضی</span>
      </div>
      <div style="display: flex; align-items: center; gap: 8px">
        <button type="button" aria-label="هفته قبل" style="width: 42px; height: 42px; border-radius: 12px; border: 1px solid #E6DCCB; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #1F2328; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
        <span style="font-size: 16px; font-weight: 900; padding: 0 6px">۱۱ تا ۱۵ مهر ۱۴۰۵</span>
        <button type="button" aria-label="هفته بعد" style="width: 42px; height: 42px; border-radius: 12px; border: 1px solid #E6DCCB; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #1F2328; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button>
        <button type="button" style="height: 42px; border-radius: 12px; border: none; background: #0F5E5A; color: #FFFFFF; padding: 0 16px; font-weight: 800; cursor: pointer">امروز</button>
      </div>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 10px">
      <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800; background: #DCEDE9; color: #0B4744; border-radius: 999px; padding: 3px 12px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3"/></svg>تماس تصویری</span>
      <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800; background: #EFE4D2; color: #5C4316; border-radius: 999px; padding: 3px 12px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16"/><path d="M16 9h2a2 2 0 0 1 2 2v10"/><path d="M3 21h18"/></svg>در دفتر</span>
      <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800; background: #FBE8CF; color: #7A3A0B; border-radius: 999px; padding: 3px 12px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/></svg>منزل متقاضی</span>
    </div>

    <div style="overflow-x: auto; border-radius: 20px; background: #FFFFFF; border: 1px solid #E6DCCB">
      <div style="min-width: 900px; display: grid; grid-template-columns: 64px repeat(5, minmax(0, 1fr))">
        <span style="height: 64px; border-bottom: 1px solid #EFE6D7"></span>
        <sc-for list="{{days}}" as="d" hint-placeholder-count="5">
          <div style="height: 64px; border-bottom: 1px solid #EFE6D7; border-right: 1px solid #EFE6D7; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.35; background: {{d.headBg}}">
            <span style="font-size: 13px; font-weight: 700; color: {{d.ink}}">{{d.wd}}</span>
            <span style="font-size: 20px; font-weight: 900; color: {{d.ink}}">{{d.n}}</span>
          </div>
        </sc-for>

        <div style="display: flex; flex-direction: column">
          <sc-for list="{{hours}}" as="h" hint-placeholder-count="9">
            <span style="height: 72px; font-size: 12px; font-weight: 700; color: #57534E; text-align: center; padding-top: 4px">{{h.label}}</span>
          </sc-for>
        </div>
        <sc-for list="{{days}}" as="d" hint-placeholder-count="5">
          <div style="position: relative; height: 648px; border-right: 1px solid #EFE6D7; background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 71px, #F3ECE1 71px, #F3ECE1 72px); background-color: {{d.colBg}}">
            <sc-if value="{{d.today}}" hint-placeholder-val="{{false}}">
              <span style="position: absolute; top: 120px; right: 0; left: 0; height: 2px; background: #B45309; z-index: 2"><span style="position: absolute; right: -5px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: #B45309"></span></span>
            </sc-if>
            <sc-for list="{{d.events}}" as="e" hint-placeholder-count="2">
              <div style="position: absolute; top: {{e.top}}; height: {{e.h}}; right: 6px; left: 6px; border-radius: 12px; background: {{e.bg}}; border-right: 0; padding: 6px 10px; display: flex; flex-direction: column; gap: 1px; overflow: hidden; color: {{e.ink}}; box-shadow: 0 2px 6px rgba(60,40,10,0.08)">
                <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; line-height: 1.4">
                  <sc-if value="{{e.isVideo}}" hint-placeholder-val="{{true}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3"/></svg></sc-if>
                  <sc-if value="{{e.isOffice}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16"/><path d="M16 9h2a2 2 0 0 1 2 2v10"/><path d="M3 21h18"/></svg></sc-if>
                  <sc-if value="{{e.isHome}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/></svg></sc-if>
                  {{e.time}}
                </span>
                <span style="font-size: 14px; font-weight: 900; line-height: 1.5">{{e.name}}</span>
                <span style="font-size: 12px; font-weight: 600; line-height: 1.5">{{e.task}}</span>
              </div>
            </sc-for>
          </div>
        </sc-for>
      </div>
    </div>
  </main>
</div>
</template>
<script src="assets/morphdom.min.js"></script>
<script src="assets/hv-runtime.js"></script>
<script>
class Component extends DCLogic {
  renderVals() {
    const H = 72;
    const types = {
      video: { bg: '#DCEDE9', ink: '#0B4744' },
      office: { bg: '#EFE4D2', ink: '#5C4316' },
      home: { bg: '#FBE8CF', ink: '#7A3A0B' }
    };
    const ev = (start, end, type, name, task, time) => Object.assign({
      top: Math.round((start - 9) * H + 3) + 'px',
      h: Math.round((end - start) * H - 6) + 'px',
      isVideo: type === 'video', isOffice: type === 'office', isHome: type === 'home',
      name, task, time
    }, types[type]);
    const raw = [
      { wd: 'شنبه', n: '۱۱', today: true, events: [
        ev(9.5, 10.5, 'video', 'زهرا موسوی', 'ویدیو سلفی افتتاح حساب', '۹:۳۰ – ۱۰:۳۰'),
        ev(11, 12.25, 'office', 'حسن جعفری', 'افتتاح حساب + کد پیامکی', '۱۱:۰۰ – ۱۲:۱۵'),
        ev(16, 17, 'home', 'کاظم شریفی', 'عکس مدارک + کد پیامکی', '۱۶:۰۰ – ۱۷:۰۰')
      ] },
      { wd: 'یکشنبه', n: '۱۲', events: [
        ev(10.5, 11.5, 'video', 'رضا کریمی', 'کد پیامکی مرآت', '۱۰:۳۰ – ۱۱:۳۰')
      ] },
      { wd: 'دوشنبه', n: '۱۳', events: [
        ev(9, 10.5, 'office', 'علی و مریم', 'ویدیو سلفی هر دو نفر', '۹:۰۰ – ۱۰:۳۰'),
        ev(14, 15, 'video', 'منیژه کاظمی', 'مرور نتیجه مرآت', '۱۴:۰۰ – ۱۵:۰۰')
      ] },
      { wd: 'سه‌شنبه', n: '۱۴', events: [
        ev(10, 11, 'home', 'عباس رضایی', 'تأیید درخواست در ام‌رسالت', '۱۰:۰۰ – ۱۱:۰۰'),
        ev(16.5, 17.75, 'office', 'مهری صادقی و ضامن', 'امضای سفته الکترونیک', '۱۶:۳۰ – ۱۷:۴۵')
      ] },
      { wd: 'چهارشنبه', n: '۱۵', events: [
        ev(11.5, 12.5, 'video', 'محمد نوری', 'ثبت درخواست وام', '۱۱:۳۰ – ۱۲:۳۰')
      ] }
    ];
    const fa = ['۹', '۱۰', '۱۱', '۱۲', '۱۳', '۱۴', '۱۵', '۱۶', '۱۷'];
    return {
      hours: fa.map((h) => ({ label: h + ':۰۰' })),
      days: raw.map((d) => ({
        wd: d.wd, n: d.n, today: !!d.today, events: d.events,
        headBg: d.today ? '#0F5E5A' : '#FFFFFF',
        ink: d.today ? '#FFFFFF' : '#1F2328',
        colBg: d.today ? '#FBF7F0' : '#FFFFFF'
      }))
    };
  }
}
HV.mount(Component, {});
</script>
</body>
</html>

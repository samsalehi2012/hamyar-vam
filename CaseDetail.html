<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0F5E5A">
<title>همیار وام · پنل کارشناس · پرونده رضا کریمی</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/site.css">
<style>
body{margin:0;background:#F6F1E8}
*{box-sizing:border-box}
button,input,textarea{font-family:inherit}
a{color:#0F5E5A}a:hover{color:#0B4744}
textarea::placeholder{color:#8A8279}
</style>
</head>
<body class="hv-desktop">
<div id="hv-app"></div>
<template id="hv-tpl">
<div class="hv-root" dir="rtl" style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #F6F1E8; color: #1F2328; font-family: 'Vazirmatn', Tahoma, sans-serif; font-size: 15px; line-height: 1.7">

  <aside style="flex: 1 1 232px; max-width: 100%; background: #0B4744; color: #FFFFFF; padding: 22px 16px; display: flex; flex-direction: column; gap: 22px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 6px">
      <svg width="36" height="36" viewBox="0 0 40 40" aria-hidden="true"><path d="M5 38V19a15 15 0 0 1 30 0v19z" fill="#FBF7F0"/><circle cx="20" cy="17.5" r="5.2" fill="#E9B949"/><path d="M11 27.5c2.8 2.6 5.8 3.8 9 3.8s6.2-1.2 9-3.8" stroke="#0B4744" stroke-width="2.8" fill="none" stroke-linecap="round"/></svg>
      <div style="display: flex; flex-direction: column; line-height: 1.35">
        <span style="font-size: 19px; font-weight: 900">همیار وام</span>
        <span style="font-size: 12px; color: #9FD3CB; font-weight: 600">پنل کارشناس</span>
      </div>
    </div>
    <nav aria-label="منوی پنل" style="display: flex; flex-direction: column; gap: 4px">
      <a href="Dashboard.dc.html" style="height: 46px; border-radius: 12px; color: #CFE6E2; display: flex; align-items: center; gap: 10px; padding: 0 12px; font-weight: 700; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>داشبورد</a>
      <a href="CaseDetail.dc.html" aria-current="page" style="height: 46px; border-radius: 12px; background: rgba(255,255,255,0.12); color: #FFFFFF; display: flex; align-items: center; gap: 10px; padding: 0 12px; font-weight: 800; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>پرونده‌ها</a>
      <a href="Calendar.dc.html" style="height: 46px; border-radius: 12px; color: #CFE6E2; display: flex; align-items: center; gap: 10px; padding: 0 12px; font-weight: 700; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>تقویم جلسات</a>
      <a href="Rules.dc.html" style="height: 46px; border-radius: 12px; color: #CFE6E2; display: flex; align-items: center; gap: 10px; padding: 0 12px; font-weight: 700; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>قواعد وام</a>
    </nav>
    <div style="margin-top: auto; display: flex; align-items: center; gap: 10px; border-radius: 14px; background: rgba(255,255,255,0.08); padding: 10px">
      <span style="width: 40px; height: 40px; border-radius: 50%; background: #E9DCC5; color: #6B4E1F; font-weight: 900; display: flex; align-items: center; justify-content: center">س</span>
      <span style="display: flex; flex-direction: column; line-height: 1.4"><span style="font-weight: 800">سارا رحیمی</span><span style="font-size: 12px; color: #9FD3CB">کارشناس پرونده</span></span>
    </div>
  </aside>

  <main style="flex: 999 1 560px; min-width: 0; padding: 22px 28px 32px; display: flex; flex-direction: column; gap: 18px">
    <nav aria-label="مسیر" style="display: flex; align-items: center; gap: 6px; font-size: 14px; color: #57534E; font-weight: 600">
      <a href="Dashboard.dc.html" style="color: #57534E">پرونده‌ها</a><span aria-hidden="true">/</span><span style="color: #1F2328; font-weight: 800">رضا کریمی</span>
    </nav>

    <section style="border-radius: 22px; background: #FFFFFF; border: 1px solid #E6DCCB; padding: 18px 20px; display: flex; flex-wrap: wrap; gap: 18px; align-items: center">
      <span style="width: 64px; height: 74px; flex: none; border-radius: 32px 32px 14px 14px; background: #0F5E5A; color: #F3D27E; font-size: 22px; font-weight: 900; display: flex; align-items: center; justify-content: center">ر ک</span>
      <div style="flex: 1 1 360px; display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
          <h1 style="margin: 0; font-size: 26px; font-weight: 900; line-height: 1.4">رضا کریمی</h1>
          <span style="font-size: 13px; font-weight: 800; background: #FCEFD9; color: #92400E; border-radius: 999px; padding: 1px 12px">مرحله ۱: مدارک · نوبت متقاضی</span>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 6px; font-size: 13px; font-weight: 700">
          <span style="background: #F3EBDD; border-radius: 999px; padding: 1px 10px">۶۸ ساله · بازنشسته</span>
          <span style="background: #F3EBDD; border-radius: 999px; padding: 1px 10px">وام عادی ۱۵۰ میلیون · ۳ ساله</span>
          <span style="background: #F3EBDD; border-radius: 999px; padding: 1px 10px">از امتیاز پسرش، مهدی کریمی</span>
          <span style="background: #F3EBDD; border-radius: 999px; padding: 1px 10px" dir="ltr">۰۹۱۲ ۳۴۵ ۶۷۸۹</span>
        </div>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center">
        <label style="display: flex; flex-direction: column; font-size: 12px; color: #57534E; font-weight: 700; line-height: 1.4">کارشناس مسئول
          <select style="height: 40px; border-radius: 10px; border: 1px solid #E6DCCB; background: #FBF7F0; font-family: inherit; font-size: 14px; font-weight: 800; padding: 0 10px; color: #1F2328; margin-top: 4px">
            <option>سارا رحیمی</option>
            <option>محسن مقدم</option>
          </select>
        </label>
        <button type="button" style="height: 44px; border-radius: 12px; border: 1.5px solid #0F5E5A; background: #FFFFFF; color: #0F5E5A; display: flex; align-items: center; gap: 8px; padding: 0 14px; font-weight: 800; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>تماس</button>
        <button type="button" style="height: 44px; border-radius: 12px; border: none; background: #0F5E5A; color: #FFFFFF; display: flex; align-items: center; gap: 8px; padding: 0 14px; font-weight: 800; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>پیام صوتی به متقاضی</button>
      </div>
    </section>

    <div style="display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start">
      <div style="flex: 2 1 620px; min-width: 0; display: flex; flex-direction: column; gap: 18px">

        <section style="border-radius: 22px; background: #FFFFFF; border: 1px solid #E6DCCB; padding: 18px; display: flex; flex-direction: column; gap: 14px">
          <div style="display: flex; align-items: center; justify-content: space-between">
            <h2 style="margin: 0; font-size: 18px; font-weight: 900">مدارک · ۲ از ۶ تأیید شده</h2>
            <span style="font-size: 13px; color: #57534E; font-weight: 700">چک‌لیست: وام عادی × بازنشسته × امتیاز خانواده</span>
          </div>
          <div style="display: flex; flex-wrap: wrap; gap: 16px">
            <div style="flex: 1 1 250px; display: flex; flex-direction: column; gap: 6px">
              <sc-for list="{{docs}}" as="d" hint-placeholder-count="6">
                <button type="button" onClick="{{d.pick}}" aria-pressed="{{d.on}}" style="min-height: 52px; border-radius: 12px; border: 1.5px solid {{d.border}}; background: {{d.bg}}; display: flex; align-items: center; gap: 10px; padding: 6px 10px; text-align: right; color: #1F2328; cursor: pointer">
                  <span style="flex: 1; display: flex; flex-direction: column; line-height: 1.45">
                    <span style="font-size: 14px; font-weight: 800">{{d.name}}</span>
                    <span style="font-size: 12px; color: #57534E">{{d.who}}</span>
                  </span>
                  <span style="font-size: 12px; font-weight: 800; background: {{d.tagBg}}; color: {{d.tagInk}}; border-radius: 999px; padding: 1px 9px; white-space: nowrap">{{d.tag}}</span>
                </button>
              </sc-for>
            </div>
            <div style="flex: 1.4 1 320px; display: flex; flex-direction: column; gap: 10px">
              <div style="height: 330px; border-radius: 16px; background: #2A3634; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden">
                <div aria-hidden="true" style="width: 200px; height: 266px; transform: rotate(-3deg); border-radius: 8px; background: #EFE6D2; box-shadow: 0 16px 34px rgba(0,0,0,0.45); padding: 18px 16px; display: flex; flex-direction: column; gap: 10px; filter: {{previewBlur}}">
                  <div style="display: flex; justify-content: space-between; align-items: flex-start">
                    <span style="width: 24px; height: 24px; border-radius: 50%; border: 2px solid #B9A98A"></span>
                    <span style="width: 46px; height: 58px; border-radius: 4px; background: #CFC2A6"></span>
                  </div>
                  <span style="height: 7px; width: 80%; border-radius: 9px; background: #BFAF8E"></span>
                  <span style="height: 7px; width: 60%; border-radius: 9px; background: #BFAF8E"></span>
                  <span style="height: 7px; width: 90%; border-radius: 9px; background: #BFAF8E"></span>
                  <span style="height: 7px; width: 70%; border-radius: 9px; background: #BFAF8E"></span>
                  <span style="height: 7px; width: 85%; border-radius: 9px; background: #BFAF8E"></span>
                </div>
                <div style="position: absolute; top: 10px; left: 10px; display: flex; gap: 6px">
                  <button type="button" aria-label="بزرگ‌نمایی" style="width: 38px; height: 38px; border-radius: 10px; border: none; background: rgba(255,255,255,0.9); color: #1F2328; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M11 8v6M8 11h6"/></svg></button>
                  <button type="button" aria-label="چرخاندن" style="width: 38px; height: 38px; border-radius: 10px; border: none; background: rgba(255,255,255,0.9); color: #1F2328; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
                </div>
                <span style="position: absolute; bottom: 10px; right: 10px; font-size: 12px; font-weight: 700; color: #FFFFFF; background: rgba(0,0,0,0.45); border-radius: 999px; padding: 1px 10px">{{previewName}} · ۹ مهر · ۴۱۰ KB</span>
              </div>
              <div style="display: flex; gap: 8px">
                <button type="button" style="flex: 1; height: 46px; border-radius: 12px; border: none; background: #2E7D32; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 800; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>تأیید مدرک</button>
                <button type="button" style="flex: 1; height: 46px; border-radius: 12px; border: 1.5px solid #B42318; background: #FFFFFF; color: #A32014; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 800; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>رد با دلیل</button>
              </div>
              <div style="display: flex; flex-direction: column; gap: 8px; border-radius: 14px; background: #FBF7F0; border: 1px solid #EFE6D7; padding: 12px">
                <span style="font-size: 13px; font-weight: 800; color: #57534E">دلیل آماده</span>
                <div style="display: flex; flex-wrap: wrap; gap: 6px">
                  <sc-for list="{{reasons}}" as="r" hint-placeholder-count="4">
                    <button type="button" onClick="{{r.pick}}" aria-pressed="{{r.on}}" style="height: 36px; border-radius: 999px; border: 1.5px solid {{r.border}}; background: {{r.bg}}; color: {{r.color}}; padding: 0 14px; font-size: 14px; font-weight: 800; cursor: pointer">{{r.label}}</button>
                  </sc-for>
                </div>
                <span style="font-size: 13px; font-weight: 800; color: #57534E; margin-top: 4px">پیامی که متقاضی می‌گیرد (متن ساده + صوتی)</span>
                <p style="margin: 0; font-size: 15px; font-weight: 700; line-height: 1.8; background: #FFFFFF; border-radius: 10px; padding: 10px 12px; border: 1px solid #E6DCCB">{{message}}</p>
                <button type="button" style="height: 44px; border-radius: 12px; border: none; background: #0F5E5A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 800; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/></svg>فرستادن پیام و درخواست عکس دوباره</button>
              </div>
            </div>
          </div>
        </section>

        <section style="border-radius: 22px; background: #FFFFFF; border: 1px solid #E6DCCB; padding: 18px; display: flex; flex-direction: column; gap: 12px">
          <h2 style="margin: 0; font-size: 18px; font-weight: 900">پاسخ پرسش‌ها</h2>
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap: 10px">
            <div style="border-radius: 12px; background: #FBF7F0; padding: 10px 12px; display: flex; flex-direction: column; line-height: 1.5"><span style="font-size: 12px; color: #57534E; font-weight: 700">هدف وام</span><span style="font-weight: 800">خرج زندگی و کار شخصی</span></div>
            <div style="border-radius: 12px; background: #FBF7F0; padding: 10px 12px; display: flex; flex-direction: column; line-height: 1.5"><span style="font-size: 12px; color: #57534E; font-weight: 700">حساب رسالت دارد؟</span><span style="font-weight: 800">بله</span></div>
            <div style="border-radius: 12px; background: #FBF7F0; padding: 10px 12px; display: flex; flex-direction: column; line-height: 1.5"><span style="font-size: 12px; color: #57534E; font-weight: 700">سیم‌کارت به نام خودش؟</span><span style="font-weight: 800">بله</span></div>
            <div style="border-radius: 12px; background: #FBF7F0; padding: 10px 12px; display: flex; flex-direction: column; line-height: 1.5"><span style="font-size: 12px; color: #57534E; font-weight: 700">چک برگشتی یا قسط معوق</span><span style="font-weight: 800">ندارد</span></div>
            <div style="border-radius: 12px; background: #FBF7F0; padding: 10px 12px; display: flex; flex-direction: column; line-height: 1.5"><span style="font-size: 12px; color: #57534E; font-weight: 700">شغل</span><span style="font-weight: 800">بازنشسته</span></div>
            <div style="border-radius: 12px; background: #FBF7F0; padding: 10px 12px; display: flex; flex-direction: column; line-height: 1.5"><span style="font-size: 12px; color: #57534E; font-weight: 700">منبع</span><span style="font-weight: 800">امتیاز پسرش (بستگان درجه یک)</span></div>
            <div style="border-radius: 12px; background: #FCF0DA; padding: 10px 12px; display: flex; flex-direction: column; line-height: 1.5"><span style="font-size: 12px; color: #7A3A0B; font-weight: 700">نتیجه اولیه</span><span style="font-weight: 800; color: #7A3A0B">چراغ زرد · با کار اضافه</span></div>
            <div style="border-radius: 12px; background: #FBF7F0; padding: 10px 12px; display: flex; flex-direction: column; line-height: 1.5"><span style="font-size: 12px; color: #57534E; font-weight: 700">معدل لازم (تخمین)</span><span style="font-weight: 800">۲۵۰ میلیون تومان</span></div>
          </div>
        </section>
      </div>

      <div style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 18px">
        <section style="border-radius: 22px; background: #FFFFFF; border: 1px solid #E6DCCB; padding: 18px; display: flex; flex-direction: column; gap: 10px">
          <h2 style="margin: 0; font-size: 17px; font-weight: 900">یادداشت داخلی</h2>
          <div style="border-radius: 12px; background: #FFF8E8; border: 1px solid #F1DFB8; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px">
            <span style="font-size: 14px; font-weight: 600; line-height: 1.8">مهدی (پسر) برآورد تسهیلات را در ام‌رسالت ثبت کرده؛ منتظر تأیید بانک. شناسنامه مهدی تار بود.</span>
            <span style="font-size: 12px; color: #57534E; font-weight: 700">سارا رحیمی · دیروز ۱۶:۴۰</span>
          </div>
          <label for="hv-note" style="font-size: 13px; font-weight: 800; color: #57534E">یادداشت تازه (فقط کارشناسان می‌بینند)</label>
          <textarea id="hv-note" rows="3" placeholder="مثلاً: جلسه یکشنبه برای کد پیامکی مرآت…" style="border-radius: 12px; border: 1px solid #E6DCCB; background: #FBF7F0; padding: 10px 12px; font-size: 14px; resize: vertical; color: #1F2328"></textarea>
          <button type="button" style="height: 42px; border-radius: 12px; border: 1.5px solid #0F5E5A; background: #FFFFFF; color: #0F5E5A; font-weight: 800; cursor: pointer">ثبت یادداشت</button>
        </section>

        <section style="border-radius: 22px; background: #FFFFFF; border: 1px solid #E6DCCB; padding: 18px; display: flex; flex-direction: column; gap: 10px">
          <h2 style="margin: 0; font-size: 17px; font-weight: 900">جلسه همراهی</h2>
          <div style="display: flex; gap: 10px; align-items: center; border-radius: 12px; background: #E2EEEB; padding: 10px 12px; color: #0B4744">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3"/></svg>
            <span style="display: flex; flex-direction: column; line-height: 1.5"><span style="font-weight: 800">یکشنبه ۱۲ مهر · ۱۰:۳۰</span><span style="font-size: 13px; font-weight: 600">تماس تصویری · کد پیامکی مرآت</span></span>
          </div>
        </section>

        <section style="border-radius: 22px; background: #FFFFFF; border: 1px solid #E6DCCB; padding: 18px; display: flex; flex-direction: column; gap: 12px">
          <h2 style="margin: 0; font-size: 17px; font-weight: 900">تاریخچه</h2>
          <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px">
            <li style="display: flex; gap: 10px"><span style="width: 10px; height: 10px; flex: none; margin-top: 8px; border-radius: 50%; background: #B45309"></span><span style="display: flex; flex-direction: column; line-height: 1.6"><span style="font-weight: 700">درخواست عکس دوباره: شناسنامه پسر</span><span style="font-size: 12px; color: #57534E">امروز ۹:۱۵ · سارا</span></span></li>
            <li style="display: flex; gap: 10px"><span style="width: 10px; height: 10px; flex: none; margin-top: 8px; border-radius: 50%; background: #2E7D32"></span><span style="display: flex; flex-direction: column; line-height: 1.6"><span style="font-weight: 700">تأیید کارت ملی و شماره حساب</span><span style="font-size: 12px; color: #57534E">امروز ۹:۱۲ · سارا</span></span></li>

<script>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const doc = s.doc || 'sonId';
    const reason = s.reason || 'blur';
    const tags = {
      ok: ['تأیید شد', '#E5F2E5', '#1B5E20'],
      review: ['در حال بررسی', '#E2EEEB', '#0B4744'],
      redo: ['عکس دوباره', '#FCEFD9', '#92400E'],
      none: ['نرسیده', '#F1ECE4', '#57534E']
    };
    const docList = [
      { id: 'nid', name: 'کارت ملی هوشمند', who: 'متقاضی', st: 'ok' },
      { id: 'acc', name: 'شماره حساب رسالت', who: 'متقاضی', st: 'ok' },
      { id: 'pay', name: 'فیش مستمری', who: 'متقاضی', st: 'review' },
      { id: 'sonId', name: 'شناسنامه پسر', who: 'صاحب امتیاز · برای نسبت', st: 'redo' },
      { id: 'birth', name: 'شناسنامه', who: 'متقاضی', st: 'none' },
      { id: 'sonNid', name: 'کارت ملی پسر', who: 'صاحب امتیاز', st: 'none' }
    ];
    const msgs = {
      blur: 'عکس شناسنامه پسرتان کمی تار بود. لطفاً در نور روز، گوشی را ثابت نگه دارید و یک‌بار دیگر عکس بگیرید.',
      cut: 'یک قسمت از شناسنامه پسرتان در عکس نیامده. لطفاً طوری عکس بگیرید که هر چهار گوشه پیدا باشد.',
      expired: 'این مدرک تاریخ گذشته است. لطفاً نسخه تازه را بفرستید؛ اگر سؤالی دارید با ما تماس بگیرید.',
      unreadable: 'نوشته‌های عکس خوانده نمی‌شود. لطفاً از نزدیک‌تر و در نور بیشتر عکس بگیرید.'
    };
    const rl = [['blur', 'تار'], ['cut', 'بریده'], ['expired', 'منقضی'], ['unreadable', 'ناخوانا']];
    const sel = docList.find((d) => d.id === doc) || docList[3];
    return {
      docs: docList.map((d) => ({
        name: d.name, who: d.who, on: d.id === doc,
        tag: tags[d.st][0], tagBg: tags[d.st][1], tagInk: tags[d.st][2],
        border: d.id === doc ? '#0F5E5A' : '#EFE6D7',
        bg: d.id === doc ? '#F4FAF8' : '#FFFFFF',
        pick: () => this.setState({ doc: d.id })
      })),
      previewName: sel.name,
      previewBlur: sel.st === 'redo' ? 'blur(2px)' : 'none',
      reasons: rl.map(([id, label]) => ({
        label, on: id === reason,
        border: id === reason ? '#B45309' : '#E6DCCB',
        bg: id === reason ? '#FCEFD9' : '#FFFFFF',
        color: id === reason ? '#7A3A0B' : '#1F2328',
        pick: () => this.setState({ reason: id })
      })),
      message: msgs[reason]
    };
  }
}
HV.mount(Component, {});
</script>
